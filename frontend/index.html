<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI DJ · clauseekio</title>
<style>
  /* ═══════════════════════════════════════════════
     AI DJ · Nova — Deep Space × Cyan-Purple
     ═══════════════════════════════════════════════ */
  :root {
    --bg: #050510;
    --cyan-r: 0; --cyan-g: 212; --cyan-b: 255;
    --cyan: rgb(var(--cyan-r), var(--cyan-g), var(--cyan-b));
    --purple-r: 124; --purple-g: 58; --purple-b: 237;
    --purple: rgb(var(--purple-r), var(--purple-g), var(--purple-b));
    --glass: rgba(10,10,30,0.55);
    --glass-border: rgba(255,255,255,0.06);
    --radius-lg: 24px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "SF Pro Display", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #050510; color: #eaeaef;
    height: 100vh; overflow: hidden;
    user-select: none; -webkit-user-select: none;
    -webkit-font-smoothing: antialiased;
  }
  body.cl-a { overflow-y: auto; background: #0a0a0f; }

  /* Animations */
  @keyframes twinkle { 0%,100%{opacity:0.1} 50%{opacity:0.8} }
  @keyframes breathe { 0%,100%{opacity:0.4;transform:scale(1)} 50%{opacity:1;transform:scale(1.025)} }
  @keyframes ringPulse { 0%,100%{opacity:0.5;transform:translate(-50%,-50%) scale(1)} 50%{opacity:1;transform:translate(-50%,-50%) scale(1.04)} }
  @keyframes onAirPulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes fadeInUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  .scrollbar-hide::-webkit-scrollbar { display: none; }
  .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
  .glass { background: rgba(10,10,30,0.55); backdrop-filter: blur(20px) saturate(180%); border: 1px solid rgba(255,255,255,0.06); }
  .glass-light { background: rgba(255,255,255,0.05); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.08); }

  #bgCanvas { position: fixed; inset: 0; z-index: 0; pointer-events: none; }

  .modal-overlay { position: fixed; inset: 0; z-index: 200; background: rgba(0,0,0,0.7); backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.25s; }
  .modal-overlay.show { opacity: 1; pointer-events: auto; }
  .modal-box { background: rgba(10,10,30,0.9); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 28px; width: min(520px, 92vw); max-height: 80vh; overflow-y: auto; }
  .modal-box h2 { color: #fff; font-size: 18px; font-weight: 600; margin-bottom: 16px; }
  .modal-box input { width: 100%; padding: 10px 14px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.05); color: #fff; font-size: 13px; outline: none; }
  .modal-box input:focus { border-color: rgba(0,212,255,0.4); }
  .btn { padding: 8px 18px; border-radius: 10px; border: none; cursor: pointer; font-size: 13px; font-weight: 500; transition: all 0.2s; font-family: inherit; }
  .btn-grad { background: linear-gradient(135deg, #06b6d4, #a855f7); color: #fff; box-shadow: 0 0 20px rgba(6,182,212,0.3); }
  .btn-grad:hover { box-shadow: 0 0 30px rgba(6,182,212,0.5); transform: scale(1.03); }
  .btn-ghost { background: rgba(255,255,255,0.05); color: #9ca3af; border: 1px solid rgba(255,255,255,0.1); }
  .btn-ghost:hover { background: rgba(255,255,255,0.1); color: #fff; }

  /* Playlist slide */
  .pl-slide { position: fixed; left: 0; top: 52px; bottom: 0; z-index: 150; width: 320px;
    background: rgba(8,8,20,0.85); backdrop-filter: blur(24px); border-right: 1px solid rgba(255,255,255,0.06);
    transform: translateX(-100%); transition: transform 0.3s cubic-bezier(0.4,0,0.2,1); }
  .pl-slide.open { transform: translateX(0); }
  .pl-item { display: flex; align-items: center; gap: 10px; padding: 10px 16px; cursor: pointer; transition: background 0.15s; border-bottom: 1px solid rgba(255,255,255,0.03); font-size: 13px; }
  .pl-item:hover { background: rgba(255,255,255,0.04); }
  .pl-item.active { background: rgba(0,212,255,0.08); border-left: 2px solid #06b6d4; }
  .pl-idx { color: #585878; width: 24px; text-align: right; font-size: 11px; }
  .pl-name { flex: 1; color: #eaeaef; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pl-dur { color: #585878; font-size: 11px; }
  .pl-del { color: #ef4444; cursor: pointer; padding: 2px 6px; border-radius: 4px; font-size: 14px; opacity: 0; transition: opacity 0.15s; }
  .pl-item:hover .pl-del { opacity: 1; }

  /* Vinyl disc */
  .vinyl { width: 200px; height: 200px; border-radius: 50%;
    background: radial-gradient(circle at center, #1a1a2e 0%, #2a1a3e 15%, #111 40%, #0a0a0a 60%, #222 62%, #0a0a0a 65%, #111 100%);
    position: relative; transition: animation-play-state 0.5s;
  }
  .vinyl.spinning { animation: spin 6s linear infinite; }
  .vinyl.paused { animation: spin 6s linear infinite; animation-play-state: paused; }

  /* Chat */
  .chat-msg { display: flex; gap: 10px; margin-bottom: 12px; animation: fadeInUp 0.3s ease; }
  .chat-msg.user { flex-direction: row-reverse; }
  .chat-avatar { width: 32px; height: 32px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
  .chat-msg.dj .chat-avatar { background: linear-gradient(135deg, rgba(6,182,212,0.2), rgba(168,85,247,0.2)); border: 1px solid rgba(6,182,212,0.2); }
  .chat-msg.user .chat-avatar { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); }
  .chat-bubble { padding: 10px 14px; border-radius: 14px; font-size: 13px; line-height: 1.5; max-width: 85%; }
  .chat-msg.dj .chat-bubble { background: rgba(6,182,212,0.08); border: 1px solid rgba(6,182,212,0.12); color: #eaeaef; border-bottom-left-radius: 4px; }
  .chat-msg.user .chat-bubble { background: rgba(168,85,247,0.12); border: 1px solid rgba(168,85,247,0.15); color: #eaeaef; border-bottom-right-radius: 4px; }

  /* Activity chips */
  .act-chip { padding: 4px 12px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.08); background: rgba(255,255,255,0.03); color: #9898b8; font-size: 11px; cursor: pointer; transition: all 0.2s; font-family: inherit; white-space: nowrap; }
  .act-chip:hover { border-color: rgba(0,212,255,0.3); color: #06b6d4; }
  .act-chip.active { background: rgba(0,212,255,0.1); border-color: rgba(0,212,255,0.3); color: #06b6d4; }

  /* Search results */
  .sr-item { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 10px; cursor: pointer; transition: background 0.15s; }
  .sr-item:hover { background: rgba(255,255,255,0.04); }
  .sr-cover { width: 44px; height: 44px; border-radius: 8px; object-fit: cover; background: rgba(255,255,255,0.05); }
  .sr-info { flex: 1; min-width: 0; }
  .sr-name { color: #fff; font-size: 13px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sr-artist { color: #9898b8; font-size: 11px; margin-top: 2px; }

  /* Rec cards */
  .rec-card { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 12px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05); transition: all 0.2s; cursor: pointer; margin-bottom: 8px; }
  .rec-card:hover { background: rgba(255,255,255,0.06); border-color: rgba(6,182,212,0.2); }
  .rec-cover { width: 40px; height: 40px; border-radius: 8px; object-fit: cover; background: rgba(255,255,255,0.05); }
  .rec-info { flex: 1; min-width: 0; }
  .rec-title { color: #fff; font-size: 12px; font-weight: 500; }
  .rec-artist { color: #9898b8; font-size: 11px; }
  .rec-reason { color: #06b6d4; font-size: 10px; margin-top: 2px; }

  /* Claudio view */
  .cl-view { display: none; }
  .cl-view.active { display: flex; flex-direction: column; }
</style>
</head>
<body>
<div id="root"></div>
<audio id="audioPlayer" preload="auto"></audio>
<canvas id="bgCanvas"></canvas>

<script src="/react.min.js"></script>
<script src="/react-dom.min.js"></script>
<script src="/babel.min.js"></script>
<script src="/tailwind.js"></script>

<script type="text/babel">
const { useState, useEffect, useRef, useReducer, useCallback, useMemo } = React;

/* ═════════════════════════════════════════════════
 * 1. SVG Icon Components
 * ═════════════════════════════════════════════════ */
const PlayIcon = () => (
  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
    <polygon points="6 3 20 12 6 21 6 3" />
  </svg>
);
const PauseIcon = () => (
  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
    <rect x="14" y="4" width="4" height="16" rx="1" /><rect x="6" y="4" width="4" height="16" rx="1" />
  </svg>
);
const SkipBack = () => (
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
    <polygon points="19 20 9 12 19 4 19 20" /><line x1="5" x2="5" y1="19" y2="5" />
  </svg>
);
const SkipFwd = () => (
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
    <polygon points="5 4 15 12 5 20 5 4" /><line x1="19" x2="19" y1="5" y2="19" />
  </svg>
);
const HeartIcon = ({ filled }) => (
  <svg width="18" height="18" viewBox="0 0 24 24" fill={filled ? "currentColor" : "none"} stroke="currentColor" strokeWidth="2">
    <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z" />
  </svg>
);
const VolumeIcon = () => (
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
    <path d="M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z" />
    <path d="M16 9a5 5 0 0 1 0 6" /><path d="M19.364 18.364a9 9 0 0 0 0-12.728" />
  </svg>
);
const SendIcon = () => (
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
    <path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z" />
    <path d="m21.854 2.147-10.94 10.939" />
  </svg>
);

/* ═════════════════════════════════════════════════
 * 2. Utility Functions
 * ═════════════════════════════════════════════════ */
function fmtTime(s) {
  if (isNaN(s) || s < 0) return '0:00';
  return Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');
}

async function api(path, method = 'GET', body) {
  const o = { method, headers: {} };
  if (body) { o.headers['Content-Type'] = 'application/json'; o.body = JSON.stringify(body); }
  const r = await fetch(path, o);
  if (!r.ok) { let m = r.statusText; try { m = (await r.json()).error || m; } catch (e) {} throw new Error(m); }
  return r.json();
}

function parseLrc(lrc) {
  const lines = []; const re = /\[(\d{2}):(\d{2})[.:](\d{2,3})\](.*)/g;
  let m; while ((m = re.exec(lrc)) !== null) {
    const min = parseInt(m[1]), sec = parseInt(m[2]), ms = parseInt(m[3]);
    lines.push({ time: min * 60 + sec + (ms >= 100 ? ms / 1000 : ms), text: m[4].trim() });
  }
  lines.sort((a, b) => a.time - b.time);
  return lines;
}

function parseActions(fullText) {
  const actionPattern = /\[\[(\w+)(?::([^\]]*))?\]\]/g;
  let match; const actions = [];
  while ((match = actionPattern.exec(fullText)) !== null) {
    actions.push({ type: match[1], arg: match[2] || '' });
  }
  return actions;
}

function cleanActionText(text) {
  return text.replace(/\[\[\w+(?::[^\]]*)?\]\]/g, '').trim();
}

/* ═════════════════════════════════════════════════
 * 3. State Reducer
 * ═════════════════════════════════════════════════ */
const initialState = {
  isPlaying: false,
  currentTime: 0,
  duration: 0,
  volume: 0.8,
  progress: 0,
  playlist: { songs: [], current_index: -1 },
  currentSong: null,
  lyricsLines: [],
  currentLyricIndex: -1,
  currentMode: 'dj',
  currentView: 'dj',
  appState: 'idle',
  isDjTalking: false,
  speechText: '',
  segueType: null,
  reasonText: '',
  showReactions: false,
  pendingSong: null,
  pendingNext: false,
  transitionTriggered: false,
  chatHistory: [],
  userActivity: '',
  lastMood: 'chill',
  recentTransitions: [],
  lastReason: '',
  lastSegue: '',
  weather: { icon: '☀️', temp: '20°', time: '' },
  totalSeconds: 0,
  liked: false,
  directPlay: false,
  directSong: null,
  clShuffle: false,
  clRepeat: 'off',
  clVisualMode: 'Arcs',
  clAudioSidebar: null,
};

function reducer(state, action) {
  switch (action.type) {
    case 'SET_PLAYING': return { ...state, isPlaying: action.payload };
    case 'SET_TIME': return { ...state, currentTime: action.payload };
    case 'SET_DURATION': return { ...state, duration: action.payload };
    case 'SET_VOLUME': return { ...state, volume: action.payload };
    case 'SET_PLAYLIST': return { ...state, playlist: action.payload };
    case 'SET_CURRENT_INDEX': return { ...state, playlist: { ...state.playlist, current_index: action.payload } };
    case 'SET_CURRENT_SONG': return { ...state, currentSong: action.payload };
    case 'SET_LYRICS': return { ...state, lyricsLines: parseLrc(action.payload), currentLyricIndex: -1 };
    case 'CLEAR_LYRICS': return { ...state, lyricsLines: [], currentLyricIndex: -1 };
    case 'SET_LYRIC_INDEX': return { ...state, currentLyricIndex: action.payload };
    case 'SET_MODE': return { ...state, currentMode: action.payload };
    case 'SET_VIEW': return { ...state, currentView: action.payload };
    case 'SET_APP_STATE': return { ...state, appState: action.payload };
    case 'SET_DJ_TALKING': return { ...state, isDjTalking: action.payload };
    case 'SET_SPEECH': return { ...state, speechText: action.payload.text || '', segueType: action.payload.segue || null, reasonText: action.payload.reason || '', showReactions: action.payload.showReactions !== false };
    case 'CLEAR_SPEECH': return { ...state, speechText: '', segueType: null, reasonText: '', showReactions: false };
    case 'SET_PENDING_SONG': return { ...state, pendingSong: action.payload };
    case 'SET_PENDING_NEXT': return { ...state, pendingNext: action.payload };
    case 'SET_TRANSITION_TRIGGERED': return { ...state, transitionTriggered: action.payload };
    case 'ADD_CHAT_MESSAGE': return { ...state, chatHistory: [...state.chatHistory, action.payload].slice(-20) };
    case 'SET_CHAT_HISTORY': return { ...state, chatHistory: action.payload };
    case 'SET_USER_ACTIVITY': return { ...state, userActivity: action.payload };
    case 'SET_MOOD': return { ...state, lastMood: action.payload };
    case 'ADD_TRANSITION': {
      const t = [...(state.recentTransitions || []), action.payload];
      return { ...state, recentTransitions: t.slice(-10) };
    }
    case 'SET_WEATHER': return { ...state, weather: action.payload };
    case 'SET_STATS': return { ...state, totalSeconds: action.payload };
    case 'SET_LIKED': return { ...state, liked: action.payload };
    case 'SET_DIRECT_PLAY': return { ...state, directPlay: action.payload.direct, directSong: action.payload.song };
    case 'TOGGLE_SHUFFLE': return { ...state, clShuffle: !state.clShuffle };
    case 'CYCLE_REPEAT': {
      const modes = ['off', 'all', 'one'];
      const idx = modes.indexOf(state.clRepeat);
      return { ...state, clRepeat: modes[(idx + 1) % modes.length] };
    }
    case 'SET_VISUAL_MODE': return { ...state, clVisualMode: action.payload };
    case 'TOGGLE_SIDEBAR': return { ...state, clAudioSidebar: state.clAudioSidebar === action.payload ? null : action.payload };
    default: return state;
  }
}

/* ═════════════════════════════════════════════════
 * 4. Hooks
 * ═════════════════════════════════════════════════ */

// ── Audio Player ──
function useAudioPlayer(audioRef, state, dispatch) {
  const seekPending = useRef(false);

  const loadSong = useCallback((idx) => {
    const songs = state.playlist.songs;
    if (idx < 0 || idx >= songs.length) return;
    dispatch({ type: 'SET_TRANSITION_TRIGGERED', payload: false });
    const song = songs[idx];
    dispatch({ type: 'SET_CURRENT_SONG', payload: song });
    dispatch({ type: 'SET_CURRENT_INDEX', payload: idx });
    dispatch({ type: 'SET_LIKED', payload: false });
    const audio = audioRef.current;
    if (!audio) return;
    if (song.source === 'netease' && song.netease_id) {
      audio.src = `/api/audio?source=netease&netease_id=${song.netease_id}&proxy=1`;
    } else {
      audio.src = `/api/audio?path=${encodeURIComponent(song.path || '')}`;
    }
    audio.load();
    api('/api/playlist/current', 'POST', { index: idx }).catch(() => {});
    api('/api/stats/song-play', 'POST', { song_index: idx }).catch(() => {});
    dispatch({ type: 'SET_DIRECT_PLAY', payload: { direct: false, song: null } });
  }, [state.playlist.songs]);

  const play = useCallback(async () => {
    const audio = audioRef.current;
    if (!audio) return;
    if ((!audio.src || audio.src === window.location.href) && state.playlist.songs.length > 0) {
      loadSong(0);
      setTimeout(() => audio.play().catch(() => {}), 100);
      return;
    }
    try {
      await audio.play();
    } catch (e) {
      if (e.name === 'NotSupportedError') {
        audio.addEventListener('canplay', () => audio.play().catch(() => {}), { once: true });
      }
    }
  }, [state.playlist.songs.length]);

  const pause = useCallback(() => {
    audioRef.current?.pause();
  }, []);

  const togglePlay = useCallback(() => {
    state.isPlaying ? pause() : play();
  }, [state.isPlaying, play, pause]);

  const nextTrack = useCallback(() => {
    const songs = state.playlist.songs;
    if (!songs.length) return;
    loadSong((state.playlist.current_index + 1) % songs.length);
    setTimeout(() => play(), 200);
  }, [state.playlist]);

  const prevTrack = useCallback(() => {
    const songs = state.playlist.songs;
    if (!songs.length) return;
    let i = state.playlist.current_index - 1;
    if (i < 0) i = songs.length - 1;
    loadSong(i);
    if (state.isPlaying) play();
  }, [state.playlist, state.isPlaying]);

  const seekTo = useCallback((pct) => {
    const audio = audioRef.current;
    if (!audio || !audio.duration || isNaN(audio.duration)) return;
    seekPending.current = true;
    audio.currentTime = pct * audio.duration;
    setTimeout(() => { seekPending.current = false; }, 300);
  }, []);

  // Attach audio events
  useEffect(() => {
    const audio = audioRef.current;
    if (!audio) return;
    const onPlay = () => dispatch({ type: 'SET_PLAYING', payload: true });
    const onPause = () => dispatch({ type: 'SET_PLAYING', payload: false });
    const onEnded = () => {
      if (state.directPlay) {
        dispatch({ type: 'SET_DIRECT_PLAY', payload: { direct: false, song: null } });
        if (state.playlist.songs.length > 0 && state.playlist.current_index >= 0) {
          loadSong(state.playlist.current_index);
          setTimeout(() => play(), 200);
        }
        return;
      }
      if (state.appState === 'speaking' || state.isDjTalking) {
        dispatch({ type: 'SET_PENDING_NEXT', payload: true });
        return;
      }
      dispatch({ type: 'CLEAR_SPEECH' });
      dispatch({ type: 'TRANSITION_TRIGGERED', payload: false });
      nextTrack();
    };
    const onTimeUpdate = () => {
      if (seekPending.current) return;
      const c = audio.currentTime, d = audio.duration;
      if (isNaN(d) || d <= 0) return;
      dispatch({ type: 'SET_TIME', payload: c });
      dispatch({ type: 'SET_DURATION', payload: d });
    };
    const onLoadedMeta = () => dispatch({ type: 'SET_DURATION', payload: audio.duration || 0 });
    audio.addEventListener('play', onPlay);
    audio.addEventListener('pause', onPause);
    audio.addEventListener('ended', onEnded);
    audio.addEventListener('timeupdate', onTimeUpdate);
    audio.addEventListener('loadedmetadata', onLoadedMeta);
    return () => {
      audio.removeEventListener('play', onPlay);
      audio.removeEventListener('pause', onPause);
      audio.removeEventListener('ended', onEnded);
      audio.removeEventListener('timeupdate', onTimeUpdate);
      audio.removeEventListener('loadedmetadata', onLoadedMeta);
    };
  }, [state.directPlay, state.appState, state.isDjTalking, state.playlist]);

  // Transition trigger
  useEffect(() => {
    if (state.transitionTriggered) return;
    if (state.currentMode !== 'dj') return;
    const audio = audioRef.current;
    if (!audio || !audio.duration || isNaN(audio.duration)) return;
    if (audio.duration - audio.currentTime <= 12 && audio.duration - audio.currentTime > 0) {
      dispatch({ type: 'SET_TRANSITION_TRIGGERED', payload: true });
    }
  }, [state.currentTime, state.duration, state.currentMode, state.transitionTriggered]);

  // Volume sync
  useEffect(() => {
    if (audioRef.current) audioRef.current.volume = state.volume;
  }, [state.volume]);

  return { loadSong, play, pause, togglePlay, nextTrack, prevTrack, seekTo };
}

// ── Visualizer ──
function useAudioVisualizer(audioRef, isPlaying) {
  const spectrumRef = useRef(null);
  const waveformRef = useRef(null);
  const ctxRef = useRef(null);
  const analyserRef = useRef(null);
  const startedRef = useRef(false);
  const animRef = useRef(null);

  const init = useCallback(async () => {
    if (startedRef.current) return;
    startedRef.current = true;
    try {
      const actx = new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === 'suspended') await actx.resume();
      const analyser = actx.createAnalyser();
      analyser.fftSize = 256;
      const source = actx.createMediaElementSource(audioRef.current);
      source.connect(analyser);
      analyser.connect(actx.destination);
      analyserRef.current = analyser;
      ctxRef.current = actx;
    } catch (e) { console.warn('Spectrum init failed:', e); }
  }, []);

  useEffect(() => {
    if (!isPlaying || !analyserRef.current) return;
    const draw = () => {
      const a = analyserRef.current;
      const sCanvas = spectrumRef.current;
      const wCanvas = waveformRef.current;
      if (!a || !sCanvas || !wCanvas) { animRef.current = requestAnimationFrame(draw); return; }
      // Match canvas resolution to display size
      if (sCanvas.clientWidth && sCanvas.width !== sCanvas.clientWidth) {
        sCanvas.width = sCanvas.clientWidth;
        sCanvas.height = sCanvas.clientHeight;
      }
      if (wCanvas && wCanvas.clientWidth && wCanvas.width !== wCanvas.clientWidth) {
        wCanvas.width = wCanvas.clientWidth;
        wCanvas.height = wCanvas.clientHeight;
      }
      const sCtx = sCanvas.getContext('2d');
      const wCtx = wCanvas.getContext('2d');
      const bufLen = a.frequencyBinCount;
      const freqData = new Uint8Array(bufLen);
      a.getByteFrequencyData(freqData);
      // Spectrum
      const SW = sCanvas.width, SH = sCanvas.height;
      sCtx.clearRect(0, 0, SW, SH);
      const barCount = 48, barW = SW / barCount - 1;
      for (let i = 0; i < barCount; i++) {
        const idx = Math.floor(i * bufLen / barCount);
        const h = (freqData[idx] / 255) * SH * 0.85;
        const x = i * (SW / barCount);
        const grad = sCtx.createLinearGradient(0, SH, 0, SH - h);
        grad.addColorStop(0, 'rgba(6,182,212,0.7)');
        grad.addColorStop(0.5, 'rgba(168,85,247,0.4)');
        grad.addColorStop(1, 'rgba(6,182,212,0.15)');
        sCtx.fillStyle = grad;
        sCtx.fillRect(x, SH - h, barW, h);
      }
      // Waveform
      const WW = wCanvas.width, WH = wCanvas.height;
      const waveData = new Uint8Array(bufLen);
      a.getByteTimeDomainData(waveData);
      wCtx.clearRect(0, 0, WW, WH);
      wCtx.beginPath();
      wCtx.strokeStyle = 'rgba(6,182,212,0.5)';
      wCtx.lineWidth = 1.5;
      wCtx.shadowColor = 'rgba(6,182,212,0.3)';
      wCtx.shadowBlur = 6;
      for (let i = 0; i < waveData.length; i++) {
        const x = (i / waveData.length) * WW;
        const y = (waveData[i] / 255) * WH;
        if (i === 0) wCtx.moveTo(x, WH / 2 + (y - WH / 2) * 0.7);
        else wCtx.lineTo(x, WH / 2 + (y - WH / 2) * 0.7);
      }
      wCtx.stroke();
      wCtx.shadowBlur = 0;
      animRef.current = requestAnimationFrame(draw);
    };
    animRef.current = requestAnimationFrame(draw);
    return () => cancelAnimationFrame(animRef.current);
  }, [isPlaying]);

  return { spectrumRef, waveformRef, init };
}

// ── Lyrics ──
function useLyrics(state, dispatch) {
  const fetchLyrics = useCallback(async (neteaseId) => {
    if (!neteaseId) { dispatch({ type: 'CLEAR_LYRICS' }); return; }
    try {
      const r = await api('/api/netease/song/lyric', 'POST', { id: neteaseId });
      const lrc = r.lrc?.lyric || r.data?.lrc?.lyric || '';
      if (!lrc.trim()) { dispatch({ type: 'CLEAR_LYRICS' }); return; }
      dispatch({ type: 'SET_LYRICS', payload: lrc });
    } catch (e) { dispatch({ type: 'CLEAR_LYRICS' }); }
  }, []);

  useEffect(() => {
    if (!state.lyricsLines.length) return;
    const t = state.currentTime;
    let idx = -1;
    for (let i = state.lyricsLines.length - 1; i >= 0; i--) {
      if (t >= state.lyricsLines[i].time) { idx = i; break; }
    }
    if (idx !== state.currentLyricIndex) {
      dispatch({ type: 'SET_LYRIC_INDEX', payload: idx });
    }
  }, [state.currentTime, state.lyricsLines]);

  // Fetch lyrics when song changes
  useEffect(() => {
    const song = state.currentSong;
    if (song && song.source === 'netease' && song.netease_id) {
      fetchLyrics(song.netease_id);
    } else {
      dispatch({ type: 'CLEAR_LYRICS' });
    }
  }, [state.currentSong?.netease_id]);

  return { fetchLyrics };
}

// ── TTS Engine ──
function useTTS(state, dispatch, onEnd) {
  const audioRef = useRef(null);
  const queueRef = useRef([]);
  const idxRef = useRef(0);
  const abortRef = useRef(false);
  const doneRef = useRef(false);
  const fallbackVoice = useRef(null);
  const onEndRef = useRef(onEnd);
  onEndRef.current = onEnd;

  const stop = useCallback(() => {
    abortRef.current = true; queueRef.current = []; idxRef.current = 0; doneRef.current = false;
    if (audioRef.current) { audioRef.current.pause(); audioRef.current = null; }
    if ('speechSynthesis' in window) window.speechSynthesis.cancel();
    dispatch({ type: 'SET_DJ_TALKING', payload: false });
  }, []);

  const _playChunk = useCallback(() => {
    if (abortRef.current || idxRef.current >= queueRef.current.length) {
      dispatch({ type: 'SET_DJ_TALKING', payload: false });
      if (onEndRef.current) onEndRef.current();
      return;
    }
    const url = queueRef.current[idxRef.current];
    idxRef.current++;
    const a = new Audio(url);
    audioRef.current = a;
    a.onended = () => {
      URL.revokeObjectURL(url);
      if (idxRef.current < queueRef.current.length) _playChunk();
      else if (doneRef.current) { dispatch({ type: 'SET_DJ_TALKING', payload: false }); if (onEndRef.current) onEndRef.current(); }
    };
    a.onerror = () => {
      URL.revokeObjectURL(url);
      if (idxRef.current < queueRef.current.length) _playChunk();
      else { dispatch({ type: 'SET_DJ_TALKING', payload: false }); if (onEndRef.current) onEndRef.current(); }
    };
    a.play().catch(() => {});
  }, []);

  const _fallback = useCallback((text, mood) => {
    if (!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    if (!text) { dispatch({ type: 'SET_DJ_TALKING', payload: false }); if (onEndRef.current) onEndRef.current(); return; }
    // Strip [em:word] SSML markers — these are for Volcano TTS only
    const cleanText = text.replace(/\[em:[^\]]*\]/g, '').replace(/\s+/g, ' ').trim();
    if (!cleanText) { dispatch({ type: 'SET_DJ_TALKING', payload: false }); if (onEndRef.current) onEndRef.current(); return; }
    const u = new SpeechSynthesisUtterance(cleanText);
    u.lang = 'zh-CN'; u.volume = 0.85;
    const presets = { energetic: { rate: 1.08, pitch: 1.15 }, chill: { rate: 0.9, pitch: 0.95 }, melancholy: { rate: 0.85, pitch: 0.85 }, playful: { rate: 1.05, pitch: 1.1 }, nostalgic: { rate: 0.88, pitch: 0.9 }, default: { rate: 0.95, pitch: 1.0 } };
    const p = presets[mood] || presets['default'];
    u.rate = p.rate; u.pitch = p.pitch;
    if (fallbackVoice.current) u.voice = fallbackVoice.current;
    u.onend = () => { dispatch({ type: 'SET_DJ_TALKING', payload: false }); if (onEndRef.current) onEndRef.current(); };
    window.speechSynthesis.speak(u);
  }, []);

  const speakStream = useCallback((text, mood) => {
    stop();
    abortRef.current = false; queueRef.current = []; idxRef.current = 0; doneRef.current = false;
    dispatch({ type: 'SET_DJ_TALKING', payload: true });
    fetch('/api/tts/synthesize/stream', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text, mood: mood || 'chill' }) })
      .then(resp => {
        if (!resp.ok) { _fallback(text, mood); return; }
        const reader = resp.body.getReader();
        const decoder = new TextDecoder(); let buffer = '';
        function readLoop() {
          if (abortRef.current) { reader.cancel(); return; }
          reader.read().then(({ value, done }) => {
            if (done) return;
            buffer += decoder.decode(value, { stream: true });
            const lines = buffer.split('\n'); buffer = lines.pop() || '';
            for (const line of lines) {
              if (line.startsWith('data: ')) {
                const b64 = line.slice(6).trim(); if (!b64) continue;
                try {
                  const bin = atob(b64);
                  const bytes = new Uint8Array(bin.length);
                  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
                  const blob = new Blob([bytes], { type: 'audio/mpeg' });
                  queueRef.current.push(URL.createObjectURL(blob));
                  if (queueRef.current.length === 1) _playChunk();
                } catch (e) {}
              } else if (line.startsWith('event: done')) {
                doneRef.current = true;
              }
            }
            readLoop();
          }).catch(() => { _fallback(text, mood); });
        }
        readLoop();
      }).catch(() => { _fallback(text, mood); });
  }, [stop, _playChunk, _fallback]);

  const speakHttp = useCallback((text, mood) => {
    stop();
    dispatch({ type: 'SET_DJ_TALKING', payload: true });
    fetch('/api/tts/synthesize', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text, mood: mood || 'chill' }) })
      .then(resp => { if (!resp.ok) throw new Error('status ' + resp.status); return resp.blob(); })
      .then(blob => {
        const url = URL.createObjectURL(blob);
        const a = new Audio(url); audioRef.current = a;
        a.onended = () => { URL.revokeObjectURL(url); dispatch({ type: 'SET_DJ_TALKING', payload: false }); if (onEndRef.current) onEndRef.current(); };
        a.onerror = () => { URL.revokeObjectURL(url); _fallback(text, mood); };
        a.play();
      }).catch(() => { _fallback(text, mood); });
  }, [stop, _fallback]);

  const speak = useCallback((text, mood) => {
    if (!text) return;
    stop();
    if (text.length > 20) speakStream(text, mood);
    else speakHttp(text, mood);
  }, [stop, speakStream, speakHttp]);

  // Preload voices
  useEffect(() => {
    if ('speechSynthesis' in window) {
      speechSynthesis.getVoices();
      speechSynthesis.onvoiceschanged = () => {
        const voices = speechSynthesis.getVoices();
        fallbackVoice.current = voices.find(v => v.lang.startsWith('zh-CN') || v.lang.startsWith('zh-TW')) || null;
      };
    }
  }, []);

  return { speak, stop };
}

// ── Interjections (SSE) ──
function useInterjections(state, dispatch, ttsSpeak) {
  const evRef = useRef(null);
  const lastTs = useRef(0);

  useEffect(() => {
    function connect() {
      if (evRef.current) evRef.current.close();
      const es = new EventSource('/api/agent/stream');
      evRef.current = es;
      es.addEventListener('interjection', (e) => {
        try {
          const i = JSON.parse(e.data);
          if (!i.say) return;
          if (lastTs.current && Date.now() - lastTs.current < 10000) return;
          if (state.appState === 'speaking') return;
          lastTs.current = Date.now();
          const iText = (i.say || '').replace(/\[em:[^\]]*\]/g, '');
          dispatch({ type: 'SET_SPEECH', payload: { text: iText, segue: null, reason: i.reason || '', showReactions: false } });
          ttsSpeak(i.say, i.mood);
        } catch (_) {}
      });
      es.onerror = () => {
        setTimeout(connect, 5000);
      };
    }
    connect();
    return () => { if (evRef.current) evRef.current.close(); };
  }, [state.appState]);
}

// ── Weather ──
function useWeather(dispatch) {
  const update = useCallback(async () => {
    try {
      const w = await api('/api/weather');
      const m = { '01d': '☀️', '01n': '🌙', '02d': '⛅', '02n': '⛅', '03d': '☁️', '03n': '☁️', '09d': '🌧️', '10d': '🌦️', '11d': '⛈️', '13d': '🌨️', '50d': '🌫️' };
      dispatch({ type: 'SET_WEATHER', payload: { icon: m[w.icon] || '☀️', temp: w.temp + '°', time: w.time || '' } });
    } catch (e) {}
  }, []);
  useEffect(() => { update(); const t = setInterval(update, 600000); return () => clearInterval(t); }, [update]);
  return update;
}

// ── Keyboard Shortcuts ──
function useKeyboardShortcuts(actions) {
  useEffect(() => {
    const h = (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      switch (e.code) {
        case 'Space': e.preventDefault(); actions.togglePlay(); break;
        case 'ArrowRight': actions.next(); break;
        case 'ArrowLeft': actions.prev(); break;
        case 'KeyI': actions.showImport(); break;
        case 'KeyS': actions.showNeteaseSearch(); break;
        case 'KeyP': actions.togglePlaylist(); break;
        case 'Escape': actions.closeAll(); break;
      }
    };
    document.addEventListener('keydown', h);
    return () => document.removeEventListener('keydown', h);
  }, [actions]);
}

      const r = await api('/api/playlist/scan', 'POST', { path: path.trim() });
      setStatus(`新增 ${r.added} 首，共 ${r.total} 首`);
      onRefresh(); setTimeout(onClose, 1500);
    } catch (e) { setStatus('扫描失败: ' + e.message); }
  };

  return (
    <div className={'modal-overlay ' + (show ? 'show' : '')} onClick={e => { if (e.target.classList.contains('modal-overlay')) onClose(); }}>
      <div className="modal-box">
        <h2>📁 导入本地音乐</h2>
        <input type="text" value={path} onChange={e => setPath(e.target.value)} onKeyDown={e => e.key === 'Enter' && scan()}

        </div>
        <input ref={fileRef} type="file" webkitdirectory="" directory="" multiple style={{ display: 'none' }} onChange={async () => {

          const music = files.filter(f => exts.has('.' + f.name.split('.').pop().toLowerCase()));
          setStatus(`处理 ${music.length} 个文件...`);
          for (const f of music) {

const PlaylistImportModal = ({ show, onClose, onRefresh, playlistSongs }) => {
  const [pid, setPid] = useState('');
  const [status, setStatus] = useState('');
  const importFn = async () => {
    const match = pid.match(/id[=:]\s*(\d+)/);
    const id = match ? match[1] : pid.replace(/\D/g, '');
    if (!id) { setStatus('请输入有效的歌单ID'); return; }
    setStatus('正在获取...');
    try {
      const r = await api('/api/netease/playlist/tracks', 'POST', { id, limit: 500 });
      const tracks = r.songs || r.data?.songs || r.playlist?.tracks || [];
      if (!tracks.length) { setStatus('歌单为空或需Cookie'); return; }
      const existingIds = new Set((playlistSongs || []).filter(s => s.source === 'netease' && s.netease_id).map(s => String(s.netease_id)));
      const importSongs = [];
      for (const t of tracks) {
        if (existingIds.has(String(t.id))) continue;
        const artists = (t.ar || t.artists || []).map(a => a.name).join(' / ');
        importSongs.push({ source: 'netease', netease_id: t.id, path: '', title: t.name, artist: artists, album: t.al?.name || t.album?.name || '', duration: Math.floor((t.dt || t.duration || 0) / 1000), tags: [], cover: t.al?.picUrl || t.album?.picUrl || '' });
      }
      const r2 = await api('/api/playlist/import', 'POST', { songs: importSongs });
      onRefresh(); setStatus(`导入完成！新增 ${r2.added} 首`);
      setTimeout(onClose, 2000);
    } catch (e) { setStatus('导入失败: ' + e.message); }
  };
  return (
    <div className={'modal-overlay ' + (show ? 'show' : '')} onClick={e => { if (e.target.classList.contains('modal-overlay')) onClose(); }}>
      <div className="modal-box">
        <h2>📋 导入网易云歌单</h2>
        <input type="text" value={pid} onChange={e => setPid(e.target.value)} onKeyDown={e => e.key === 'Enter' && importFn()} placeholder="输入歌单链接或ID" />
        <div className="flex justify-between mt-4">
          <span className="text-xs text-gray-500 self-center">{status}</span>
          <div className="flex gap-2">
            <button className="btn btn-ghost" onClick={onClose}>取消</button>
            <button className="btn btn-grad" onClick={importFn}>导入</button>
          </div>
        </div>
      </div>
    </div>
  );
};

const LikesModal = ({ show, onClose, onRefresh, playlistSongs }) => {
  const [status, setStatus] = useState('');
  const load = async () => {
    setStatus('正在获取...');
    try {
      const r = await api('/api/netease/likelist', 'POST', {});
      const ids = r.ids || r.data?.ids || [];
      if (!ids.length) { setStatus('获取失败，请检查Cookie和UID配置'); return; }
      setStatus(`找到 ${ids.length} 首，获取详情中...`);
      const existingIds = new Set((playlistSongs || []).filter(s => s.source === 'netease' && s.netease_id).map(s => String(s.netease_id)));
      const importSongs = [];
      for (let i = 0; i < ids.length; i += 50) {
        const batch = ids.slice(i, i + 50).join(',');
        const detail = await api('/api/netease/song/detail', 'POST', { ids: batch });
        const songs = detail.songs || detail.data?.songs || [];
        for (const song of songs) {
          if (existingIds.has(String(song.id))) continue;
          const artists = (song.ar || song.artists || []).map(a => a.name).join(' / ');
          importSongs.push({ source: 'netease', netease_id: song.id, path: '', title: song.name, artist: artists, album: song.al?.name || '', duration: Math.floor((song.dt || 0) / 1000), tags: [], cover: song.al?.picUrl || '' });
        }
      }
      const r2 = await api('/api/playlist/import', 'POST', { songs: importSongs });
      onRefresh(); setStatus(`导入完成！新增 ${r2.added} 首`);
      setTimeout(onClose, 2000);
    } catch (e) { setStatus('失败: ' + e.message); }
  };
  return (
    <div className={'modal-overlay ' + (show ? 'show' : '')} onClick={e => { if (e.target.classList.contains('modal-overlay')) onClose(); }}>
      <div className="modal-box">
        <h2>❤️ 导入我喜欢的歌</h2>
        <p className="text-gray-400 text-xs mb-4">从网易云收藏中导入所有「我喜欢的音乐」</p>
        <div className="flex justify-between">
          <span className="text-xs text-gray-500 self-center">{status}</span>
          <div className="flex gap-2">
            <button className="btn btn-ghost" onClick={onClose}>取消</button>
            <button className="btn btn-grad" onClick={load}>开始导入</button>
          </div>
        </div>
      </div>
    </div>
  );
};

function App() {
  const [state, dispatch] = useReducer(reducer, initialState);
  const audioRef = useRef(document.getElementById('audioPlayer'));
  const stateRef = useRef(initialState);
  stateRef.current = state;
  const audioActionsRef = useRef(null);
  const [playlistOpen, setPlaylistOpen] = useState(false);
  const [modal, setModal] = useState({ import: false, search: false, playlist: false, likes: false });
  const [searchInitKw, setSearchInitKw] = useState('');
  const [recCards, setRecCards] = useState([]);

  const audioActions = useAudioPlayer(audioRef, state, dispatch);
  audioActionsRef.current = audioActions;
  const viz = useAudioVisualizer(audioRef, state.isPlaying);

  // These must be defined BEFORE useTTS since useTTS takes handleTtsEnd as onEnd callback
  const loadPendingSong = useCallback(() => {
    if (state.pendingNext) {
      dispatch({ type: 'SET_PENDING_NEXT', payload: false });
      dispatch({ type: 'CLEAR_SPEECH' });
      audioActions.nextTrack();
      return;
    }
    const song = state.pendingSong;
    if (!song) {
      dispatch({ type: 'CLEAR_SPEECH' });
      return;
    }
    dispatch({ type: 'SET_PENDING_SONG', payload: null });
    dispatch({ type: 'CLEAR_SPEECH' });
    let idx = song.playlist_index ?? -1;
    const songs = state.playlist.songs;
    // Validate playlist_index
    if (idx < 0 || idx >= songs.length) idx = -1;
    // Fallback: search by netease_id
    if (idx < 0 && song.netease_id) idx = songs.findIndex(s => String(s.netease_id) === String(song.netease_id));
    // Last resort: match by title + artist
    if (idx < 0) idx = songs.findIndex(s => s.title === song.title && s.artist === song.artist);
    if (idx >= 0) {
      audioActions.loadSong(idx);
      setTimeout(() => audioActions.play(), 200);
    } else if (song.netease_id) {
      const ns = { title: song.title, artist: song.artist, netease_id: song.netease_id, source: 'netease', cover: song.cover_url || '', tags: [], path: '' };
      const newSongs = [...state.playlist.songs, ns];
      dispatch({ type: 'SET_PLAYLIST', payload: { songs: newSongs, current_index: state.playlist.current_index } });
      idx = newSongs.length - 1;
      audioActions.loadSong(idx);
      api('/api/playlist/add', 'POST', { song: ns }).catch(() => {});
      api('/api/playlist/current', 'POST', { index: idx }).catch(() => {});
      setTimeout(() => audioActions.play(), 300);
    } else {
      audioActions.nextTrack();
    }
  }, [state.pendingSong, state.playlist.songs, state.pendingNext, audioActions]);

  const handleTtsEnd = useCallback(() => {
    dispatch({ type: 'SET_APP_STATE', payload: 'idle' });
    loadPendingSong();
  }, [loadPendingSong]);

  const tts = useTTS(state, dispatch, handleTtsEnd);
  const { fetchLyrics } = useLyrics(state, dispatch);

  useInterjections(state, dispatch, tts.speak);
  useStatsTicker(state.isPlaying, state.playlist);
  useWeather(dispatch);

  // Init
  useEffect(() => {
    (async () => {
      try { const s = await api('/api/status'); } catch (e) {}
      try { const pl = await api('/api/playlist'); dispatch({ type: 'SET_PLAYLIST', payload: pl }); } catch (e) {}
      const saved = localStorage.getItem('dj_activity') || '';
      if (saved) dispatch({ type: 'SET_USER_ACTIVITY', payload: saved });
      // Load mode first
      let mode = 'dj';
      try { const m = await api('/api/mode'); mode = (m && m.mode) ? m.mode : 'dj'; } catch (e) {}
      dispatch({ type: 'SET_MODE', payload: mode });

      // Auto-start DJ: play saved song + greet, no forced transition
      setTimeout(async () => {
        if (mode !== 'dj') return;
        const pl = await api('/api/playlist').catch(() => ({ songs: [], current_index: -1 }));
        if (pl.songs && pl.songs.length > 0 && pl.current_index >= 0) {
          audioActions.loadSong(pl.current_index);
          setTimeout(() => audioActions.play(), 300);
        }
        // Greet after song starts — but don't force transition
        // Let the natural transition trigger (12s before song end) handle it
        setTimeout(async () => {
          try {
            const greet = await api('/api/agent/greet', 'POST', { weather: {} });
            if (greet && greet.say) {
              dispatch({ type: 'SET_APP_STATE', payload: 'speaking' });
              dispatch({ type: 'SET_MOOD', payload: greet.mood || 'chill' });
              const gText = (greet.say || '').replace(/\[em:[^\]]*\]/g, '');
              dispatch({ type: 'SET_SPEECH', payload: { text: gText, segue: null, reason: '', showReactions: false } });
              tts.speak(greet.say, greet.mood || 'chill');
            }
          } catch (e) {
            // greet failed silently — not critical
          }
        }, 800);
      }, 800);
    })();
  }, []);

  // (Lyrics fetching is handled by useLyrics hook, no duplicate needed)

  // Init visualizer on first play
  useEffect(() => {
    if (state.isPlaying) viz.init();
  }, [state.isPlaying]);

  // ── Transition ──
  const doTransition = useCallback(async () => {
    dispatch({ type: 'SET_TRANSITION_TRIGGERED', payload: false });
    dispatch({ type: 'SET_APP_STATE', payload: 'speaking' });
    const songs = state.playlist.songs;
    const cur = state.playlist.current_index;
    if (songs.length < 2 || state.currentMode === 'normal') { dispatch({ type: 'SET_APP_STATE', payload: 'idle' }); return; }
    try {
      const chatCtx = (state.chatHistory || []).slice(-4).map(m => `${m.role === 'user' ? '听众' : '我'}: ${m.content}`).join('\n');
      const r = await api('/api/agent/transition', 'POST', {
        current_song: songs[cur] || {},
        weather: { description: state.weather.icon, temp: state.weather.temp },
        history: state.recentTransitions || [],
        user_activity: state.userActivity || '',
        chat_context: chatCtx,
      });
      if (r.say) {
        const displayText = (r.say || '').replace(/\[em:[^\]]*\]/g, '');
        dispatch({ type: 'SET_SPEECH', payload: { text: displayText, segue: r.segue, reason: r.reason, showReactions: true } });
        if (r.mood) dispatch({ type: 'SET_MOOD', payload: r.mood });
        dispatch({ type: 'ADD_TRANSITION', payload: displayText });
        if (r.selected_song && r.action === 'play_selected') dispatch({ type: 'SET_PENDING_SONG', payload: r.selected_song });
        tts.speak(r.say, r.mood);
        // Timeout fallback: if TTS onEnd never fires, force skip to next track
        const timeoutMs = (r.say?.length || 10) * 350 + 8000;
        const fallbackIdx = (cur + 1) % songs.length;
        setTimeout(() => {
          // Check if TTS onEnd already handled it
          if (stateRef.current.pendingSong || stateRef.current.pendingNext) return;
          dispatch({ type: 'SET_DJ_TALKING', payload: false });
          dispatch({ type: 'SET_APP_STATE', payload: 'idle' });
          dispatch({ type: 'CLEAR_SPEECH' });
          if (audioActionsRef.current) {
            audioActionsRef.current.loadSong(fallbackIdx);
            setTimeout(() => audioActionsRef.current.play(), 200);
          }
        }, timeoutMs);
      } else {
        // No speech, just switch song
        dispatch({ type: 'SET_TRANSITION_TRIGGERED', payload: false });
        audioActions.nextTrack();
      }
    } catch (e) {
      const ns = songs[(cur + 1) % songs.length] || {};
      const artist = ns.artist || '';
      const fallbacks = ['接下来这首，很适合现在的心情。', '继续听歌，这首你应该会喜欢。', artist ? `${artist}来了，这首不错。` : '接一首好听的。'];
      const say = fallbacks[Math.floor(Math.random() * fallbacks.length)];
      dispatch({ type: 'SET_SPEECH', payload: { text: say, segue: null, reason: '', showReactions: false } });
      tts.speak(say, 'chill');
      // Timeout fallback
      setTimeout(() => {
        dispatch({ type: 'SET_DJ_TALKING', payload: false });
        dispatch({ type: 'SET_APP_STATE', payload: 'idle' });
        audioActions.nextTrack();
      }, 6000);
    }
  }, [state.playlist, state.currentMode, state.chatHistory, state.recentTransitions, state.userActivity, state.weather, tts]);

  // ── Chat (with voice TTS) ──
  const sendChat = useCallback(async (msg) => {
    dispatch({ type: 'SET_APP_STATE', payload: 'chatting' });
    let audioChunks = [];
    let audioPlayer = null;
    const playNextChatAudio = () => {
      if (audioChunks.length === 0) return;
      const url = audioChunks.shift();
      audioPlayer = new Audio(url);
      audioPlayer.onended = () => {
        URL.revokeObjectURL(url);
        if (audioChunks.length > 0) playNextChatAudio();
        else audioPlayer = null;
      };
      audioPlayer.onerror = () => { URL.revokeObjectURL(url); if (audioChunks.length > 0) playNextChatAudio(); };
      audioPlayer.play().catch(() => {});
    };

    try {
      const curSong = state.currentSong || {};
      const resp = await fetch('/api/agent/chat/voice', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: msg, history: state.chatHistory || [], current_song: { title: curSong.title || '', artist: curSong.artist || '' } })
      });
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      const reader = resp.body.getReader();
      const decoder = new TextDecoder(); let buffer = ''; let fullText = '';
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n'); buffer = lines.pop() || '';
        for (const line of lines) {
          if (line.startsWith('data: ')) {
            try {
              const data = JSON.parse(line.slice(6));
              if (data.type === 'token') {
                fullText += data.text;
              } else if (data.type === 'audio' && data.data) {
                // Decode base64 audio chunk and queue for playback
                const bin = atob(data.data);
                const bytes = new Uint8Array(bin.length);
                for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
                const blob = new Blob([bytes], { type: 'audio/mpeg' });
                audioChunks.push(URL.createObjectURL(blob));
                if (!audioPlayer || audioPlayer.ended) playNextChatAudio();
              }
            } catch (e) {}
          }
        }
      }
      const actions = parseActions(fullText);
      const cleanText = cleanActionText(fullText) || fullText;
      dispatch({ type: 'ADD_CHAT_MESSAGE', payload: { role: 'assistant', content: cleanText } });
      if (actions.length > 0) await executeActions(actions);
    } catch (e) {
      dispatch({ type: 'ADD_CHAT_MESSAGE', payload: { role: 'assistant', content: '聊天服务暂时不可用。' } });
    }
    dispatch({ type: 'SET_APP_STATE', payload: 'idle' });
  }, [state.chatHistory, state.currentSong, executeActions]);

  // ── Execute Chat Actions ──
  const executeActions = useCallback(async (actions) => {
    for (const act of actions) {
      switch (act.type) {
        case 'skip':
          tts.stop();
          dispatch({ type: 'CLEAR_SPEECH' });
          dispatch({ type: 'SET_APP_STATE', payload: 'idle' });
          dispatch({ type: 'SET_PENDING_SONG', payload: null });
          audioActions.nextTrack();
          break;
        case 'search':
          setSearchInitKw(act.arg || '');
          setModal(m => ({ ...m, search: true }));
          break;
        case 'play': {
          const parts = act.arg.split('—');
          const pTitle = (parts[0] || '').trim();
          const pArtist = (parts[1] || '').trim();
          let found = false;
          for (let i = 0; i < state.playlist.songs.length; i++) {
            const s = state.playlist.songs[i];
            if ((pTitle && s.title && s.title.includes(pTitle)) || (pArtist && s.artist && s.artist.includes(pArtist))) {
              audioActions.loadSong(i); audioActions.play(); found = true; break;
            }
          }
          if (!found) {
            try {
              const sr = await api('/api/netease/search', 'POST', { keywords: (pTitle + ' ' + pArtist).trim(), limit: 5 });
              const results = sr?.result?.songs || [];
              if (results.length > 0) {
                const song = results[0];
                const ns = { title: song.name, artist: (song.artists || song.ar || []).map(a => a.name).join(' / '), netease_id: String(song.id), source: 'netease', cover: song.al?.picUrl || '', tags: [], path: '' };
                playDirectSong(ns);
                dispatch({ type: 'ADD_CHAT_MESSAGE', payload: { role: 'assistant', content: `来了——${ns.artist}的《${ns.title}》` } });
                tts.speak(`好，${ns.artist}的${ns.title}，安排上了。`, 'chill');
              }
            } catch (e) {}
          }
          break;
        }
        case 'recommend': {
          const rParts = act.arg.split('—');
          const rTitle = (rParts[0] || '').trim();
          const rArtist = (rParts[1] || '').trim();
          if (rTitle) {
            try {
              const sr = await api('/api/netease/search', 'POST', { keywords: rTitle + ' ' + rArtist, limit: 1 });
              const results = sr?.result?.songs || [];
              if (results.length > 0) {
                const s = results[0];
                setRecCards(prev => [...prev, { title: s.name, artist: (s.artists || s.ar || []).map(a => a.name).join(' / '), netease_id: String(s.id), cover: s.al?.picUrl || '', reason: 'AI DJ 推荐' }]);
              } else {
                setRecCards(prev => [...prev, { title: rTitle, artist: rArtist, reason: 'AI DJ 推荐' }]);
              }
            } catch (e) {
              setRecCards(prev => [...prev, { title: rTitle, artist: rArtist, reason: 'AI DJ 推荐' }]);
            }
          }
          break;
        }
        case 'volume': {
          const vol = parseInt(act.arg);
          if (!isNaN(vol) && vol >= 0 && vol <= 100) dispatch({ type: 'SET_VOLUME', payload: vol / 100 });
          break;
        }
      }
    }
  }, [state.playlist.songs, tts, audioActions]);

  // ── Direct play ──
  const playDirectSong = useCallback((song) => {
    dispatch({ type: 'SET_DIRECT_PLAY', payload: { direct: true, song } });
    const audio = audioRef.current;
    if (audio) {
      if (song.source === 'netease' && song.netease_id) {
        audio.src = `/api/audio?source=netease&netease_id=${song.netease_id}&proxy=1`;
      }
      audio.load();
      audioActions.play();
    }
  }, []);

  // ── Refresh playlist ──
  const refreshPlaylist = useCallback(async () => {
    try { const pl = await api('/api/playlist'); dispatch({ type: 'SET_PLAYLIST', payload: pl }); } catch (e) {}
  }, []);

  // ── Delete song ──
  const deleteSong = useCallback(async (idx) => {
    try { await api(`/api/playlist/song/${idx}`, 'DELETE'); await refreshPlaylist(); } catch (e) {}
  }, [refreshPlaylist]);

  // ── Reaction ──
  const handleReaction = useCallback(async (reaction) => {
    dispatch({ type: 'CLEAR_SPEECH' });
    if (state.playlist.current_index >= 0) {
      api('/api/agent/reaction', 'POST', { song_index: state.playlist.current_index, reaction }).catch(() => {});
    }
    if (reaction === 'skip') tts.stop();
  }, [state.playlist.current_index, tts]);

  // ── Mode toggle ──
  const toggleMode = useCallback(async () => {
    const newMode = state.currentMode === 'dj' ? 'normal' : 'dj';
    dispatch({ type: 'SET_MODE', payload: newMode });
    api('/api/mode', 'POST', { mode: newMode }).catch(() => {});
  }, [state.currentMode]);

  // ── View toggle ──
  const toggleView = useCallback(() => {
    const newView = state.currentView === 'claudio' ? 'dj' : 'claudio';
    dispatch({ type: 'SET_VIEW', payload: newView });
  }, [state.currentView]);

  // ── Keyboard ──
  const kbActions = useMemo(() => ({
    togglePlay: audioActions.togglePlay,
    next: audioActions.nextTrack,
    prev: audioActions.prevTrack,
    showImport: () => setModal(m => ({ ...m, import: true })),
    showNeteaseSearch: () => setModal(m => ({ ...m, search: true })),
    togglePlaylist: () => setPlaylistOpen(o => !o),
    closeAll: () => { setPlaylistOpen(false); setModal({ import: false, search: false, playlist: false, likes: false }); },
  }), [audioActions]);
  useKeyboardShortcuts(kbActions);

  return (
    <div className="relative w-full h-screen overflow-hidden" style={{ background: '#050510' }}>
      <BackgroundEffects />

      <TopNav state={state} dispatch={dispatch} onToggleMode={toggleMode} onToggleView={toggleView}
        onTogglePlaylist={() => setPlaylistOpen(o => !o)} playlistOpen={playlistOpen}
        onSearch={() => setModal(m => ({ ...m, search: true }))} />

      {/* DJ View */}
      <div className="fixed top-[52px] left-0 right-0 bottom-0 z-10 flex" style={{ display: state.currentView === 'dj' ? 'flex' : 'none' }}>
        <PlayerCard state={state} dispatch={dispatch} audioActions={audioActions} viz={viz}
          isDjTalking={state.isDjTalking} onTransition={doTransition} onReact={handleReaction} />
        <div className="w-[400px] flex flex-col gap-4 p-4 overflow-hidden">
          <ChatSection state={state} dispatch={dispatch} onSendChat={sendChat} ttsStop={tts.stop} />
          <RecommendationCards cards={recCards}
            onPlay={async (i) => {
              const card = recCards[i];
              try {
                const sr = await api('/api/netease/search', 'POST', { keywords: (card.title || '') + ' ' + (card.artist || ''), limit: 1 });
                const songs = sr?.result?.songs || [];
                if (songs.length > 0) {
                  const s = songs[0];
                  playDirectSong({ title: s.name, artist: (s.artists || s.ar || []).map(a => a.name).join(' / '), netease_id: String(s.id), source: 'netease', cover: s.al?.picUrl || '', tags: [], path: '' });
                }
              } catch (e) {}
            }}
            onAdd={async (i) => {
              const card = recCards[i];
              try {
                await api('/api/playlist/add', 'POST', { song: { source: 'netease', netease_id: card.netease_id || '', path: '', title: card.title || '', artist: card.artist || '', album: '', duration: 0, tags: [], cover: card.cover || '' } });
                await refreshPlaylist();
              } catch (e) {}
            }} />
        </div>
      </div>

      {/* Claudio View (placeholder) */}
      <div className="fixed top-[52px] left-0 right-0 bottom-0 z-10" style={{ display: state.currentView === 'claudio' ? 'flex' : 'none' }}>
        <div className="flex-1 flex items-center justify-center">
          <div className="glass rounded-3xl p-12 text-center">
            <h2 className="text-2xl text-white mb-2">✨ Claudio View</h2>
            <p className="text-gray-400">此视图正在重构中，请先使用 DJ 主界面。</p>
            <button className="btn btn-grad mt-4" onClick={toggleView}>返回 DJ 主界面</button>
          </div>
        </div>
      </div>

      {/* Playlist Slide */}
      <PlaylistSlide open={playlistOpen} songs={state.playlist.songs} currentIndex={state.playlist.current_index}
        onPlay={i => { audioActions.loadSong(i); audioActions.play(); }}
        onDelete={deleteSong} onClose={() => setPlaylistOpen(false)}
        onImport={() => setModal(m => ({ ...m, import: true }))}
        onSearch={() => setModal(m => ({ ...m, search: true }))}
        onImportPlaylist={() => setModal(m => ({ ...m, playlist: true }))}
        onLikes={() => setModal(m => ({ ...m, likes: true }))} />

      {/* Modals */}
      <ImportModal show={modal.import} onClose={() => setModal(m => ({ ...m, import: false }))} onRefresh={refreshPlaylist} />
      <NeteaseSearchModal show={modal.search} onClose={() => { setModal(m => ({ ...m, search: false })); setSearchInitKw(''); }} onPlayDirect={playDirectSong} onRefresh={refreshPlaylist} playlistSongs={state.playlist.songs} initKw={searchInitKw} />
      <PlaylistImportModal show={modal.playlist} onClose={() => setModal(m => ({ ...m, playlist: false }))} onRefresh={refreshPlaylist} playlistSongs={state.playlist.songs} />
      <LikesModal show={modal.likes} onClose={() => setModal(m => ({ ...m, likes: false }))} onRefresh={refreshPlaylist} playlistSongs={state.playlist.songs} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

<!-- Particle Background (non-React for performance) -->
<script>
(function() {
  const canvas = document.getElementById('bgCanvas');
  const ctx = canvas.getContext('2d');
  let W, H, particles = [];
  let mouse = { x: -9999, y: -9999 };
  const COUNT = 500, RANGE = 110, FORCE = 5, SPRING = 0.018, DAMP = 0.84;

  function resize() {
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W; canvas.height = H;
    if (!particles.length) build();
  }

  function build() {
    particles = [];
    for (let i = 0; i < COUNT; i++) {
      const cx = W / 2, cy = H / 2, rx = W * 0.7, ry = H * 0.7;
      particles.push({
        x: Math.random() * W, y: Math.random() * H,
        tx: cx + (Math.random() - 0.5) * rx, ty: cy + (Math.random() - 0.5) * ry,
        vx: 0, vy: 0, size: 0.4 + Math.random() * 1.6,
        hue: Math.random() < 0.5 ? 190 + Math.random() * 40 : 250 + Math.random() * 30,
        lit: 35 + Math.random() * 45,
        alpha: 0.2 + Math.random() * 0.7,
        driftX: (Math.random() - 0.5) * 0.15, driftY: (Math.random() - 0.5) * 0.08,
      });
    }
  }

  function tick() {
    ctx.clearRect(0, 0, W, H);
    for (const p of particles) {
      const dx = mouse.x - p.x, dy = mouse.y - p.y, ds = dx * dx + dy * dy;
      if (ds < RANGE * RANGE && ds > 0.1) {
        const d = Math.sqrt(ds), f = (RANGE - d) / RANGE;
        p.vx -= (dx / d) * f * FORCE; p.vy -= (dy / d) * f * FORCE;
      }
      p.vx += (p.tx - p.x) * SPRING + p.driftX;
      p.vy += (p.ty - p.y) * SPRING + p.driftY;
      p.vx *= DAMP; p.vy *= DAMP;
      p.x += p.vx; p.y += p.vy;
      const a = p.alpha * (mouse.down ? 1.4 : 1);
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fillStyle = `hsla(${p.hue},70%,${p.lit}%,${a})`;
      ctx.fill();
    }
    requestAnimationFrame(tick);
  }

  window.addEventListener('resize', resize);
  document.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
  document.addEventListener('mousedown', () => { mouse.down = true; });
  document.addEventListener('mouseup', () => { mouse.down = false; });
  resize(); tick();
})();
</script>
</body>
