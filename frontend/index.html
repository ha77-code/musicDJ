<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI DJ - clauseekio</title>
<style>
  :root {
    --bg-0: #010804;
    --bg-1: #03120a;
    --bg-2: #092116;
    --panel: rgba(4, 16, 12, 0.48);
    --panel-strong: rgba(5, 18, 13, 0.72);
    --panel-soft: rgba(4, 12, 10, 0.36);
    --line: rgba(110, 231, 183, 0.26);
    --line-strong: rgba(134, 239, 172, 0.45);
    --text-main: #f2fff7;
    --text-sub: rgba(208, 247, 228, 0.72);
    --text-soft: rgba(174, 219, 198, 0.56);
    --neon: #34d399;
    --neon-strong: #22c55e;
    --danger: #ef4444;
    --radius-lg: 22px;
    --radius-xl: 28px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: "Space Grotesk", "Bahnschrift", "PingFang SC", "Microsoft YaHei", sans-serif;
    background:
      radial-gradient(circle at 10% 20%, rgba(34, 197, 94, 0.15), transparent 44%),
      radial-gradient(circle at 86% 0%, rgba(16, 185, 129, 0.12), transparent 48%),
      linear-gradient(145deg, var(--bg-0), #020d08 42%, #01100a 72%, #010804);
    color: var(--text-main);
    height: 100vh;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    background:
      repeating-linear-gradient(
        to right,
        transparent 0,
        transparent 31px,
        rgba(74, 222, 128, 0.03) 32px
      );
    z-index: -2;
    opacity: 0.4;
  }

  body::after {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(circle at center, transparent 55%, rgba(0, 0, 0, 0.58));
    z-index: -1;
  }

  body.cl-a { overflow-y: auto; background: #06110b; }

  @keyframes twinkle { 0%,100%{opacity:0.08} 50%{opacity:0.76} }
  @keyframes breathe { 0%,100%{opacity:0.42;transform:scale(1)} 50%{opacity:1;transform:scale(1.022)} }
  @keyframes ringPulse { 0%,100%{opacity:0.5;transform:translate(-50%,-50%) scale(1)} 50%{opacity:1;transform:translate(-50%,-50%) scale(1.04)} }
  @keyframes onAirPulse { 0%,100%{opacity:1} 50%{opacity:0.28} }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes fadeInUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes rhythmGlow { 0%,100%{opacity:0.16;transform:scale(1)} 50%{opacity:0.56;transform:scale(1.04)} }
  @keyframes sandDrift {
    0% { transform: translate3d(-3%, -2%, 0) rotate(0deg); opacity: 0.34; }
    50% { transform: translate3d(2%, 3%, 0) rotate(1deg); opacity: 0.58; }
    100% { transform: translate3d(4%, -1%, 0) rotate(0deg); opacity: 0.38; }
  }
  @keyframes sandFall {
    0% { transform: translateY(-34%) scaleY(0.76); opacity: 0; }
    18% { opacity: 0.74; }
    100% { transform: translateY(44%) scaleY(1.18); opacity: 0; }
  }
  @keyframes sweep {
    0% { transform: translateX(-120%); }
    100% { transform: translateX(120%); }
  }

  .scrollbar-hide::-webkit-scrollbar { display: none; }
  .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }

  .glass {
    position: relative;
    background: linear-gradient(165deg, rgba(8, 26, 19, 0.72), rgba(2, 12, 9, 0.42));
    backdrop-filter: blur(20px) saturate(150%);
    border: 1px solid var(--line);
    box-shadow:
      inset 0 1px 0 rgba(204, 255, 228, 0.08),
      0 20px 48px rgba(0, 0, 0, 0.48);
  }

  .app-shell {
    position: relative;
    isolation: isolate;
  }

  .app-shell::before {
    content: '';
    position: absolute;
    inset: 72px 18px 18px;
    border: 1px solid rgba(167, 243, 208, 0.13);
    border-radius: 30px;
    pointer-events: none;
    z-index: 1;
  }

  .dj-grid-overlay {
    background-image:
      linear-gradient(to right, rgba(167, 243, 208, 0.05) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(167, 243, 208, 0.04) 1px, transparent 1px);
    background-size: 48px 48px;
    mask-image: radial-gradient(circle at center, rgba(0, 0, 0, 0.62), transparent 88%);
  }

  #root {
    position: relative;
    z-index: 5;
    width: 100%;
    height: 100%;
  }

  #bgCanvas { position: fixed; inset: 0; z-index: 0; pointer-events: none; }

  .modal-overlay {
    position: fixed;
    inset: 0;
    z-index: 200;
    background: rgba(0, 0, 0, 0.72);
    backdrop-filter: blur(10px);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s;
  }

  .modal-overlay.show { opacity: 1; pointer-events: auto; }

  .modal-box {
    background: rgba(5, 14, 10, 0.94);
    border: 1px solid rgba(110, 231, 183, 0.2);
    border-radius: var(--radius-lg);
    padding: 28px;
    width: min(540px, 92vw);
    max-height: 80vh;
    overflow-y: auto;
    box-shadow: 0 30px 56px rgba(0, 0, 0, 0.52);
  }

  .modal-box h2 {
    color: #f0fff8;
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 16px;
    letter-spacing: 0.02em;
  }

  .modal-box input {
    width: 100%;
    padding: 10px 14px;
    border-radius: 10px;
    border: 1px solid rgba(167, 243, 208, 0.22);
    background: rgba(4, 12, 9, 0.8);
    color: #f0fff8;
    font-size: 13px;
    outline: none;
  }

  .modal-box input:focus { border-color: rgba(74, 222, 128, 0.58); }

  .btn {
    padding: 8px 18px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    transition: all 0.2s;
    font-family: inherit;
  }

  .btn-grad {
    background: linear-gradient(135deg, #0f766e, #16a34a 58%, #22c55e);
    color: #f4fff8;
    box-shadow: 0 0 22px rgba(34, 197, 94, 0.26);
  }

  .btn-grad:hover {
    box-shadow: 0 0 30px rgba(34, 197, 94, 0.42);
    transform: translateY(-1px);
  }

  .btn-ghost {
    background: rgba(10, 18, 14, 0.62);
    color: rgba(211, 237, 223, 0.8);
    border: 1px solid rgba(167, 243, 208, 0.2);
  }

  .btn-ghost:hover {
    background: rgba(16, 30, 23, 0.8);
    color: #f3fff9;
    border-color: rgba(134, 239, 172, 0.44);
  }

  .pl-slide {
    position: fixed;
    left: 0;
    top: 64px;
    bottom: 0;
    z-index: 150;
    width: 344px;
    background: linear-gradient(180deg, rgba(5, 18, 13, 0.95), rgba(3, 12, 9, 0.9));
    backdrop-filter: blur(24px);
    border-right: 1px solid rgba(167, 243, 208, 0.2);
    transform: translateX(-100%);
    transition: transform 0.32s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: 24px 0 52px rgba(0, 0, 0, 0.34);
  }

  .pl-slide.open { transform: translateX(0); }

  .pl-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 16px;
    cursor: pointer;
    transition: background 0.15s;
    border-bottom: 1px solid rgba(167, 243, 208, 0.05);
    font-size: 13px;
  }

  .pl-item:hover { background: rgba(34, 197, 94, 0.09); }

  .pl-item.active {
    background: rgba(34, 197, 94, 0.14);
    border-left: 2px solid #34d399;
  }

  .pl-idx { color: rgba(183, 214, 197, 0.46); width: 24px; text-align: right; font-size: 11px; }
  .pl-name { flex: 1; color: #eafff3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pl-dur { color: rgba(183, 214, 197, 0.46); font-size: 11px; }
  .pl-del {
    color: var(--danger);
    cursor: pointer;
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 14px;
    opacity: 0;
    transition: opacity 0.15s;
  }

  .pl-item:hover .pl-del { opacity: 1; }

  .rhythm-shell {
    position: relative;
    border-radius: 22px;
    border: 1px solid var(--line-strong);
    overflow: hidden;
    background: linear-gradient(160deg, rgba(4, 18, 12, 0.82), rgba(3, 10, 8, 0.42));
  }

  .rhythm-shell::before {
    content: '';
    position: absolute;
    inset: -18%;
    background: radial-gradient(circle at center, rgba(34, 197, 94, 0.24), rgba(5, 46, 22, 0.07) 45%, transparent 75%);
    animation: rhythmGlow 4.2s ease-in-out infinite;
    pointer-events: none;
  }

  .rhythm-shell::after {
    content: '';
    position: absolute;
    top: 0;
    bottom: 0;
    width: 20%;
    background: linear-gradient(to right, transparent, rgba(220, 252, 231, 0.16), transparent);
    animation: sweep 3.2s ease-in-out infinite;
    pointer-events: none;
    opacity: 0.5;
  }

  .act-chip {
    padding: 4px 12px;
    border-radius: 999px;
    border: 1px solid rgba(148, 163, 184, 0.28);
    background: rgba(255, 255, 255, 0.74);
    color: rgba(51, 65, 85, 0.82);
    font-size: 11px;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
    white-space: nowrap;
  }

  .act-chip:hover {
    border-color: rgba(74, 222, 128, 0.45);
    color: #14532d;
    background: rgba(236, 253, 245, 0.92);
  }

  .act-chip.active {
    background: rgba(34, 197, 94, 0.14);
    border-color: rgba(74, 222, 128, 0.55);
    color: #064e3b;
    box-shadow: 0 0 14px rgba(34, 197, 94, 0.18);
  }

  .sr-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px;
    border-radius: 12px;
    cursor: pointer;
    transition: background 0.15s;
  }

  .sr-item:hover { background: rgba(34, 197, 94, 0.08); }
  .sr-cover { width: 44px; height: 44px; border-radius: 8px; object-fit: cover; background: rgba(255, 255, 255, 0.05); }
  .sr-info { flex: 1; min-width: 0; }
  .sr-name { color: #f0fff8; font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sr-artist { color: rgba(186, 219, 201, 0.66); font-size: 11px; margin-top: 2px; }

  .dj-broadcast-view {
    position: fixed;
    top: 52px;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 10;
    padding: 14px clamp(10px, 2.4vw, 28px) 18px;
    overflow: hidden;
  }

  .broadcast-frame {
    width: 100%;
    height: 100%;
    max-width: 1180px;
    margin: 0 auto;
    display: flex;
    align-items: stretch;
    justify-content: center;
  }

  .broadcast-shell {
    position: relative;
    width: 100%;
    height: 100%;
    min-height: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    border-radius: 38px;
    background: #070908;
    border: 1px solid rgba(240, 255, 246, 0.12);
    box-shadow:
      0 34px 90px rgba(0, 0, 0, 0.58),
      0 0 0 1px rgba(74, 222, 128, 0.08),
      inset 0 1px 0 rgba(255, 255, 255, 0.08);
  }

  .broadcast-shell::before {
    content: '';
    position: absolute;
    inset: -22% -8% auto;
    height: 54%;
    background:
      radial-gradient(circle at 15% 15%, rgba(74, 222, 128, 0.2), transparent 34%),
      radial-gradient(circle at 72% 10%, rgba(255, 255, 255, 0.12), transparent 38%);
    pointer-events: none;
    opacity: 0.8;
  }

  .music-stage {
    position: relative;
    flex: 0 0 46%;
    min-height: 280px;
    padding: 24px clamp(20px, 3vw, 38px) 126px;
    color: #f9fff9;
    overflow: hidden;
    background:
      linear-gradient(180deg, rgba(7, 9, 8, 0.98), rgba(12, 15, 13, 0.98)),
      radial-gradient(circle at 85% 22%, rgba(34, 197, 94, 0.18), transparent 36%);
  }

  .music-stage::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      linear-gradient(to bottom, rgba(255, 255, 255, 0.04), transparent 42%),
      repeating-linear-gradient(90deg, transparent 0 23px, rgba(255, 255, 255, 0.035) 24px);
    pointer-events: none;
    mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.9), transparent 88%);
  }

  .stage-topline {
    position: relative;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 18px;
  }

  .station-lockup {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
  }

  .station-avatar {
    width: 38px;
    height: 38px;
    border-radius: 999px;
    display: grid;
    place-items: center;
    overflow: hidden;
    color: #06130d;
    font-size: 12px;
    font-weight: 900;
    letter-spacing: 0.06em;
    background: linear-gradient(145deg, #f4fff8, #8ff0b0);
    box-shadow: 0 0 24px rgba(74, 222, 128, 0.34);
  }

  .station-avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .station-name {
    font-size: clamp(16px, 2vw, 24px);
    line-height: 1;
    font-weight: 800;
    letter-spacing: -0.045em;
  }

  .station-status {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 6px;
    color: #34d399;
    font-size: 12px;
  }

  .status-dot {
    width: 7px;
    height: 7px;
    border-radius: 999px;
    background: #34d399;
    box-shadow: 0 0 14px rgba(52, 211, 153, 0.75);
  }

  .status-dot.talking {
    animation: onAirPulse 1.1s ease-in-out infinite;
  }

  .stage-clock {
    color: rgba(248, 255, 250, 0.82);
    font-size: 13px;
    font-weight: 700;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }

  .stage-body {
    position: relative;
    z-index: 2;
    height: calc(100% - 56px);
    min-height: 0;
    display: grid;
    grid-template-columns: minmax(0, 0.92fr) minmax(320px, 1.08fr);
    align-items: stretch;
    gap: clamp(18px, 3vw, 42px);
  }

  .track-stack {
    min-width: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .stage-eyebrow {
    color: rgba(202, 255, 224, 0.62);
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  .track-title {
    max-width: 720px;
    color: #ffffff;
    font-size: clamp(26px, 3.9vw, 48px);
    line-height: 0.95;
    font-weight: 900;
    letter-spacing: -0.07em;
    text-wrap: balance;
  }

  .track-artist {
    margin-top: 12px;
    color: rgba(239, 255, 246, 0.68);
    font-size: clamp(12px, 1.2vw, 14px);
    font-weight: 600;
  }

  .lyric-pill {
    width: min(100%, 540px);
    margin-top: 18px;
    padding: 11px 14px;
    border-radius: 16px;
    color: rgba(240, 255, 247, 0.84);
    background: rgba(255, 255, 255, 0.07);
    border: 1px solid rgba(255, 255, 255, 0.1);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
    font-size: 12px;
    line-height: 1.45;
  }

  .rhythm-deck {
    position: relative;
    min-height: 138px;
    border-radius: 26px;
    overflow: hidden;
    align-self: stretch;
    background:
      radial-gradient(circle at 50% 92%, rgba(74, 222, 128, 0.26), transparent 52%),
      linear-gradient(180deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.015));
    border: 1px solid rgba(240, 255, 246, 0.1);
  }

  .rhythm-deck::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      linear-gradient(to top, rgba(52, 211, 153, 0.12), transparent 48%),
      repeating-linear-gradient(0deg, transparent 0 17px, rgba(255, 255, 255, 0.045) 18px);
    pointer-events: none;
  }

  .rhythm-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  .idle-bars {
    position: absolute;
    inset: auto 18px 18px;
    height: 44%;
    display: flex;
    align-items: end;
    gap: 3px;
    opacity: 0.42;
    pointer-events: none;
  }

  .idle-bars span {
    flex: 1;
    min-width: 2px;
    border-radius: 999px 999px 0 0;
    background: linear-gradient(to top, rgba(255, 255, 255, 0.9), rgba(167, 243, 208, 0.18));
    animation: breathe 2.8s ease-in-out infinite;
  }

  .stage-control-deck {
    position: absolute;
    left: clamp(20px, 3vw, 38px);
    right: clamp(20px, 3vw, 38px);
    bottom: 72px;
    z-index: 3;
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    align-items: center;
    gap: 18px;
  }

  .stage-progress {
    position: relative;
    min-width: 0;
    display: grid;
    grid-template-columns: auto minmax(0, 1fr) auto;
    align-items: center;
    gap: 10px;
    color: rgba(248, 255, 250, 0.82);
    font-size: 11px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }

  .wave-lane {
    position: relative;
    height: 34px;
    border-radius: 999px;
    overflow: hidden;
    cursor: pointer;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.08);
  }

  .stage-wave-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    opacity: 0.64;
  }

  .progress-rail {
    position: absolute;
    left: 10px;
    right: 10px;
    top: 50%;
    height: 3px;
    transform: translateY(-50%);
    border-radius: 999px;
    overflow: hidden;
    background: rgba(255, 255, 255, 0.18);
  }

  .progress-fill {
    height: 100%;
    border-radius: inherit;
    background: linear-gradient(90deg, #f9fff9, #34d399);
    box-shadow: 0 0 18px rgba(52, 211, 153, 0.55);
  }

  .stage-controls {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 8px;
  }

  .stage-btn {
    width: 38px;
    height: 38px;
    border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, 0.12);
    display: grid;
    place-items: center;
    cursor: pointer;
    color: #f9fff9;
    background: rgba(255, 255, 255, 0.08);
    transition: transform 0.18s, background 0.18s, border-color 0.18s;
  }

  .stage-btn:hover {
    transform: translateY(-1px);
    border-color: rgba(74, 222, 128, 0.42);
    background: rgba(255, 255, 255, 0.14);
  }

  .stage-btn.play {
    width: 48px;
    height: 48px;
    color: #06130d;
    border-color: rgba(255, 255, 255, 0.8);
    background: #f8fff9;
    box-shadow: 0 0 26px rgba(52, 211, 153, 0.42);
  }

  .stage-volume {
    position: relative;
  }

  .stage-volume-pop {
    position: absolute;
    right: 0;
    bottom: calc(100% + 10px);
    min-width: 184px;
    padding: 12px;
    border-radius: 18px;
    color: #f8fff9;
    background: rgba(7, 11, 9, 0.96);
    border: 1px solid rgba(255, 255, 255, 0.12);
    box-shadow: 0 18px 40px rgba(0, 0, 0, 0.4);
  }

  .script-paper {
    position: relative;
    z-index: 4;
    --sand-x: 72%;
    --sand-y: 22%;
    flex: 1 1 auto;
    min-height: 0;
    margin: -54px clamp(12px, 2.2vw, 28px) clamp(12px, 2vw, 24px);
    padding: clamp(20px, 2.5vw, 30px);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    color: #111814;
    border-radius: 34px 34px 30px 30px;
    background:
      radial-gradient(circle, rgba(5, 22, 13, 0.08) 1px, transparent 1.2px) 0 0 / 14px 14px,
      linear-gradient(180deg, rgba(255, 255, 255, 0.98), rgba(243, 242, 234, 0.97));
    box-shadow:
      0 -20px 60px rgba(0, 0, 0, 0.22),
      inset 0 1px 0 rgba(255, 255, 255, 0.95);
  }

  .script-paper::before {
    content: '';
    position: absolute;
    inset: 0 0 auto;
    height: 64px;
    border-radius: inherit;
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.9), transparent);
    pointer-events: none;
  }

  .script-paper::after {
    content: '';
    position: absolute;
    inset: -18%;
    z-index: 0;
    pointer-events: none;
    background:
      radial-gradient(circle at var(--sand-x) var(--sand-y), rgba(16, 185, 129, 0.22), transparent 14%),
      radial-gradient(circle at calc(var(--sand-x) + 12%) calc(var(--sand-y) + 20%), rgba(5, 150, 105, 0.12), transparent 18%),
      repeating-radial-gradient(circle at 50% 50%, rgba(9, 15, 11, 0.13) 0 1px, transparent 1px 8px);
    mix-blend-mode: multiply;
    opacity: 0.42;
    animation: sandDrift 9s ease-in-out infinite alternate;
  }

  .sand-stream {
    position: absolute;
    z-index: 1;
    top: 72px;
    bottom: 80px;
    width: 10px;
    border-radius: 999px;
    pointer-events: none;
    background:
      linear-gradient(to bottom, transparent, rgba(16, 185, 129, 0.16), rgba(17, 24, 20, 0.12), transparent);
    filter: blur(0.3px);
    opacity: 0.42;
    animation: sandFall 4.8s ease-in-out infinite;
  }

<script type="text/babel">
const { useState, useEffect, useRef, useReducer, useCallback, useMemo } = React;

/* ═════════════════════════════════════════════════
 * 1. SVG Icon Components
 * ═════════════════════════════════════════════════ */
const PlayIcon = () => (

const PauseIcon = () => (

);
const SkipBack = () => (

    <polygon points="19 20 9 12 19 4 19 20" /><line x1="5" x2="5" y1="19" y2="5" />
  </svg>
);
const SkipFwd = () => (
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
    <polygon points="5 4 15 12 5 20 5 4" /><line x1="19" x2="19" y1="5" y2="19" />
  </svg>
);
const VolumeIcon = () => (
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
    <path d="M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z" />
    <path d="M16 9a5 5 0 0 1 0 6" /><path d="M19.364 18.364a9 9 0 0 0 0-12.728" />
  </svg>
);
const SendIcon = () => (
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
    <path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z" />
    <path d="m21.854 2.147-10.94 10.939" />
  </svg>
);

/* ═════════════════════════════════════════════════
 * 2. Utility Functions
 * ═════════════════════════════════════════════════ */
function fmtTime(s) {
  if (isNaN(s) || s < 0) return '0:00';
  return Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');
}

async function api(path, method = 'GET', body) {
  const o = { method, headers: {} };
  if (body) { o.headers['Content-Type'] = 'application/json'; o.body = JSON.stringify(body); }
  const r = await fetch(path, o);
  if (!r.ok) { let m = r.statusText; try { m = (await r.json()).error || m; } catch (e) {} throw new Error(m); }
  return r.json();
}

function parseLrc(lrc) {
  const lines = []; const re = /\[(\d{2}):(\d{2})[.:](\d{2,3})\](.*)/g;
  let m; while ((m = re.exec(lrc)) !== null) {
    const min = parseInt(m[1]), sec = parseInt(m[2]), ms = parseInt(m[3]);
    lines.push({ time: min * 60 + sec + (ms >= 100 ? ms / 1000 : ms), text: m[4].trim() });
  }
  lines.sort((a, b) => a.time - b.time);
  return lines;
}

function parseActions(fullText) {
  const actionPattern = /\[\[(\w+)(?::([^\]]*))?\]\]/g;
  let match; const actions = [];
  while ((match = actionPattern.exec(fullText)) !== null) {
    actions.push({ type: match[1], arg: match[2] || '' });
  }
  return actions;
}

function cleanActionText(text) {
  return text.replace(/\[\[\w+(?::[^\]]*)?\]\]/g, '').trim();
}

function normalizeTrackText(value) {
  return String(value || '')
    .normalize('NFKC')
    .toLowerCase()
    .replace(/[《》「」『』“”"']/g, '')
    .replace(/\s+/g, ' ')
    .trim();
}

function splitTrackArg(arg) {
  const raw = String(arg || '').trim();
  if (!raw) return { title: '', artist: '' };
  const parts = raw.includes('—') ? raw.split('—') : raw.split(/\s+-\s+/);
  return {
    title: (parts[0] || '').trim(),
    artist: parts.slice(1).join(' - ').trim(),
  };
}

function trackMatchScore(song, wantedTitle, wantedArtist) {
  const title = normalizeTrackText(song?.title);
  const artist = normalizeTrackText(song?.artist);
  const targetTitle = normalizeTrackText(wantedTitle);
  const targetArtist = normalizeTrackText(wantedArtist);
  let score = 0;
  let titleMatched = !targetTitle;
  if (targetTitle && title) {
    if (title === targetTitle) { score += 80; titleMatched = true; }
    else if (title.includes(targetTitle) || targetTitle.includes(title)) { score += 45; titleMatched = true; }
  }
  if (targetArtist && artist) {
    if (artist === targetArtist) score += 30;
    else if (artist.includes(targetArtist) || targetArtist.includes(artist)) score += 16;
  }
  if (targetTitle && !titleMatched) return 0;
  return score;
}

function detectSpeechLang(text) {
  const value = String(text || '');
  const hangul = /[\uac00-\ud7af]/.test(value);
  const kana = /[\u3040-\u30ff]/.test(value);
  const cjkCount = (value.match(/[\u4e00-\u9fff]/g) || []).length;
  const latinCount = (value.match(/[A-Za-z]/g) || []).length;
  if (hangul && cjkCount < 6) return 'ko-KR';
  if (kana && cjkCount < 8) return 'ja-JP';
  if (latinCount > 8 && latinCount > cjkCount * 1.4) return 'en-US';
  return 'zh-CN';
}

/* ═════════════════════════════════════════════════
 * 3. State Reducer
 * ═════════════════════════════════════════════════ */
const initialState = {
  isPlaying: false,
  currentTime: 0,
  duration: 0,
  volume: 0.8,
  playlist: { songs: [], current_index: -1 },
  currentSong: null,
  lyricsLines: [],
  currentLyricIndex: -1,
  currentMode: 'dj',
  appState: 'idle',
  isDjTalking: false,
  speechText: '',
  reasonText: '',
  showReactions: false,
  pendingTransition: false,
  pendingSong: null,
  pendingNext: false,
  transitionTriggered: false,
  chatHistory: [],
  userActivity: '',
  lastMood: 'chill',
  recentTransitions: [],
  weather: { icon: '☀️', temp: '20°', time: '' },
  directPlay: false,
  voiceMode: 'realtime',
};

function reducer(state, action) {
  switch (action.type) {
    case 'SET_PLAYING': return { ...state, isPlaying: action.payload };
    case 'SET_TIME': return { ...state, currentTime: action.payload };
    case 'SET_DURATION': return { ...state, duration: action.payload };
    case 'SET_VOLUME': return { ...state, volume: action.payload };
    case 'SET_PLAYLIST': return { ...state, playlist: action.payload };
    case 'SET_CURRENT_INDEX': return { ...state, playlist: { ...state.playlist, current_index: action.payload } };
    case 'SET_CURRENT_SONG': return { ...state, currentSong: action.payload };
    case 'SET_LYRICS': return { ...state, lyricsLines: parseLrc(action.payload), currentLyricIndex: -1 };
    case 'CLEAR_LYRICS': return { ...state, lyricsLines: [], currentLyricIndex: -1 };
    case 'SET_LYRIC_INDEX': return { ...state, currentLyricIndex: action.payload };
    case 'SET_MODE': return { ...state, currentMode: action.payload };
    case 'SET_APP_STATE': return { ...state, appState: action.payload };
    case 'SET_DJ_TALKING': return { ...state, isDjTalking: action.payload };
    case 'SET_SPEECH': return { ...state, speechText: action.payload.text || '', reasonText: action.payload.reason || '', showReactions: action.payload.showReactions !== false };
    case 'CLEAR_SPEECH': return { ...state, speechText: '', reasonText: '', showReactions: false };
    case 'SET_PENDING_TRANSITION': return { ...state, pendingTransition: action.payload };
    case 'SET_PENDING_SONG': return { ...state, pendingSong: action.payload };
    case 'SET_PENDING_NEXT': return { ...state, pendingNext: action.payload };
    case 'SET_TRANSITION_TRIGGERED': return { ...state, transitionTriggered: action.payload };
    case 'ADD_CHAT_MESSAGE': return { ...state, chatHistory: [...state.chatHistory, action.payload].slice(-20) };
    case 'SET_CHAT_HISTORY': return { ...state, chatHistory: action.payload };
    case 'SET_USER_ACTIVITY': return { ...state, userActivity: action.payload };
    case 'SET_MOOD': return { ...state, lastMood: action.payload };
    case 'ADD_TRANSITION': {
      const t = [...(state.recentTransitions || []), action.payload];
      return { ...state, recentTransitions: t.slice(-10) };
    }
    case 'SET_WEATHER': return { ...state, weather: action.payload };
    case 'SET_DIRECT_PLAY': return { ...state, directPlay: action.payload.direct };
    case 'SET_VOICE_MODE': return { ...state, voiceMode: action.payload };
    default: return state;
  }
}

/* ═════════════════════════════════════════════════
 * 4. Hooks
 * ═════════════════════════════════════════════════ */

// ── Audio Player ──
function useAudioPlayer(audioRef, state, dispatch) {
  const seekPending = useRef(false);

  const loadSong = useCallback((idx) => {
    const songs = state.playlist.songs;
    if (idx < 0 || idx >= songs.length) return;
    dispatch({ type: 'SET_TRANSITION_TRIGGERED', payload: false });
    const song = songs[idx];
    dispatch({ type: 'SET_CURRENT_SONG', payload: song });
    dispatch({ type: 'SET_CURRENT_INDEX', payload: idx });
    const audio = audioRef.current;
    if (!audio) return;
    if (song.source === 'netease' && song.netease_id) {
      audio.src = `/api/audio?source=netease&netease_id=${song.netease_id}&proxy=1`;
    } else {
      audio.src = `/api/audio?path=${encodeURIComponent(song.path || '')}`;
    }
    audio.load();
    api('/api/playlist/current', 'POST', { index: idx }).catch(() => {});
    api('/api/stats/song-play', 'POST', { song_index: idx }).catch(() => {});
    dispatch({ type: 'SET_DIRECT_PLAY', payload: { direct: false, song: null } });
  }, [state.playlist.songs]);

  const play = useCallback(async () => {
    const audio = audioRef.current;
    if (!audio) return;
    if ((!audio.src || audio.src === window.location.href) && state.playlist.songs.length > 0) {
      const idx = state.playlist.current_index >= 0 ? state.playlist.current_index : 0;
      loadSong(idx);
      setTimeout(() => audio.play().catch(() => {}), 100);
      return;
    }
    try {
      await audio.play();
    } catch (e) {
      if (e.name === 'NotSupportedError') {
        audio.addEventListener('canplay', () => audio.play().catch(() => {}), { once: true });
      }
    }
  }, [state.playlist.songs.length, state.playlist.current_index, loadSong]);

  const pause = useCallback(() => {
    audioRef.current?.pause();
  }, []);

  const togglePlay = useCallback(() => {
    state.isPlaying ? pause() : play();
  }, [state.isPlaying, play, pause]);

  const nextTrack = useCallback(() => {
    const songs = state.playlist.songs;
    if (!songs.length) return;
    loadSong((state.playlist.current_index + 1) % songs.length);
    setTimeout(() => play(), 200);
  }, [state.playlist, loadSong, play]);

  const prevTrack = useCallback(() => {
    const songs = state.playlist.songs;
    if (!songs.length) return;
    let i = state.playlist.current_index - 1;
    if (i < 0) i = songs.length - 1;
    loadSong(i);
    if (state.isPlaying) play();
  }, [state.playlist, state.isPlaying, loadSong, play]);

  const seekTo = useCallback((pct) => {
    const audio = audioRef.current;
    if (!audio || !audio.duration || isNaN(audio.duration)) return;
    seekPending.current = true;
    audio.currentTime = pct * audio.duration;
    setTimeout(() => { seekPending.current = false; }, 300);
  }, []);

  // Attach audio events
  useEffect(() => {
    const audio = audioRef.current;
    if (!audio) return;
    const onPlay = () => dispatch({ type: 'SET_PLAYING', payload: true });
    const onPause = () => dispatch({ type: 'SET_PLAYING', payload: false });
    const onEnded = () => {
      if (state.directPlay) {
        dispatch({ type: 'SET_DIRECT_PLAY', payload: { direct: false, song: null } });
        if (state.currentMode === 'dj') {
          if (state.appState !== 'idle' || state.isDjTalking) {
            if (state.pendingSong) {
              dispatch({ type: 'SET_PENDING_NEXT', payload: true });
            } else {
              dispatch({ type: 'SET_PENDING_TRANSITION', payload: true });
            }
          } else {
            dispatch({ type: 'SET_TRANSITION_TRIGGERED', payload: true });
          }
          return;
        }
        if (state.playlist.songs.length > 0 && state.playlist.current_index >= 0) {
          loadSong(state.playlist.current_index);
          setTimeout(() => play(), 200);
        }
        return;
      }
      if (state.currentMode === 'dj') {
        if (state.appState !== 'idle' || state.isDjTalking) {
          if (state.pendingSong) {
            dispatch({ type: 'SET_PENDING_NEXT', payload: true });
          } else {
            dispatch({ type: 'SET_PENDING_TRANSITION', payload: true });
          }
          return;
        }
        dispatch({ type: 'SET_TRANSITION_TRIGGERED', payload: true });
        return;
      }
      dispatch({ type: 'CLEAR_SPEECH' });
      dispatch({ type: 'SET_TRANSITION_TRIGGERED', payload: false });
      nextTrack();
    };
    const onTimeUpdate = () => {
      if (seekPending.current) return;
      const c = audio.currentTime, d = audio.duration;
      if (isNaN(d) || d <= 0) return;
      dispatch({ type: 'SET_TIME', payload: c });
      dispatch({ type: 'SET_DURATION', payload: d });
    };
    const onLoadedMeta = () => dispatch({ type: 'SET_DURATION', payload: audio.duration || 0 });
    audio.addEventListener('play', onPlay);
    audio.addEventListener('pause', onPause);
    audio.addEventListener('ended', onEnded);
    audio.addEventListener('timeupdate', onTimeUpdate);
    audio.addEventListener('loadedmetadata', onLoadedMeta);
    return () => {
      audio.removeEventListener('play', onPlay);
      audio.removeEventListener('pause', onPause);
      audio.removeEventListener('ended', onEnded);
      audio.removeEventListener('timeupdate', onTimeUpdate);
      audio.removeEventListener('loadedmetadata', onLoadedMeta);
    };
  }, [state.directPlay, state.appState, state.isDjTalking, state.pendingSong, state.playlist, state.currentMode, state.transitionTriggered, loadSong, play, nextTrack]);

  // DJ transitions are triggered by the real `ended` event. Avoid pre-roll
  // transitions so another song is never playing underneath the next-song cue.

  // Volume sync
  useEffect(() => {
    if (audioRef.current) audioRef.current.volume = state.volume;
  }, [state.volume]);

  return { loadSong, play, pause, togglePlay, nextTrack, prevTrack, seekTo };
}

// ── Visualizer ──
function useAudioVisualizer(audioRef, isPlaying) {
  const spectrumRef = useRef(null);
  const waveformRef = useRef(null);
  const ctxRef = useRef(null);
  const analyserRef = useRef(null);
  const startedRef = useRef(false);
  const animRef = useRef(null);

  const init = useCallback(async () => {
    if (startedRef.current) return;
    startedRef.current = true;
    try {
      const actx = new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === 'suspended') await actx.resume();
      const analyser = actx.createAnalyser();
      analyser.fftSize = 256;
      const source = actx.createMediaElementSource(audioRef.current);
      source.connect(analyser);
      analyser.connect(actx.destination);
      analyserRef.current = analyser;
      ctxRef.current = actx;
    } catch (e) { console.warn('Spectrum init failed:', e); }
  }, []);

  useEffect(() => {
    if (!isPlaying || !analyserRef.current) return;
    const draw = () => {
      const a = analyserRef.current;
      const sCanvas = spectrumRef.current;
      const wCanvas = waveformRef.current;
      if (!a || !sCanvas || !wCanvas) { animRef.current = requestAnimationFrame(draw); return; }
      // Match canvas resolution to display size
      if (sCanvas.clientWidth && sCanvas.width !== sCanvas.clientWidth) {
        sCanvas.width = sCanvas.clientWidth;
        sCanvas.height = sCanvas.clientHeight;
      }
      if (wCanvas && wCanvas.clientWidth && wCanvas.width !== wCanvas.clientWidth) {
        wCanvas.width = wCanvas.clientWidth;
        wCanvas.height = wCanvas.clientHeight;
      }
      const sCtx = sCanvas.getContext('2d');
      const wCtx = wCanvas.getContext('2d');
      const bufLen = a.frequencyBinCount;
      const freqData = new Uint8Array(bufLen);
      a.getByteFrequencyData(freqData);
      // Spectrum
      const SW = sCanvas.width, SH = sCanvas.height;
      sCtx.clearRect(0, 0, SW, SH);
      const barCount = 48, barW = SW / barCount - 1;
      for (let i = 0; i < barCount; i++) {
        const idx = Math.floor(i * bufLen / barCount);
        const h = (freqData[idx] / 255) * SH * 0.85;
        const x = i * (SW / barCount);
        const grad = sCtx.createLinearGradient(0, SH, 0, SH - h);
        grad.addColorStop(0, 'rgba(248,255,249,0.88)');
        grad.addColorStop(0.5, 'rgba(52,211,153,0.62)');
        grad.addColorStop(1, 'rgba(52,211,153,0.12)');
        sCtx.fillStyle = grad;
        sCtx.fillRect(x, SH - h, barW, h);
      }
      // Waveform
      const WW = wCanvas.width, WH = wCanvas.height;
      const waveData = new Uint8Array(bufLen);
      a.getByteTimeDomainData(waveData);
      wCtx.clearRect(0, 0, WW, WH);
      wCtx.beginPath();
      wCtx.strokeStyle = 'rgba(248,255,249,0.62)';
      wCtx.lineWidth = 1.5;
      wCtx.shadowColor = 'rgba(52,211,153,0.38)';
      wCtx.shadowBlur = 6;
      for (let i = 0; i < waveData.length; i++) {
        const x = (i / waveData.length) * WW;
        const y = (waveData[i] / 255) * WH;
        if (i === 0) wCtx.moveTo(x, WH / 2 + (y - WH / 2) * 0.7);
        else wCtx.lineTo(x, WH / 2 + (y - WH / 2) * 0.7);
      }
      wCtx.stroke();
      wCtx.shadowBlur = 0;
      animRef.current = requestAnimationFrame(draw);
    };
    animRef.current = requestAnimationFrame(draw);
    return () => cancelAnimationFrame(animRef.current);
  }, [isPlaying]);

  return { spectrumRef, waveformRef, init };
}

// ── Lyrics ──
function useLyrics(state, dispatch) {
  const fetchLyrics = useCallback(async (neteaseId) => {
    if (!neteaseId) { dispatch({ type: 'CLEAR_LYRICS' }); return; }
    try {
      const r = await api('/api/netease/song/lyric', 'POST', { id: neteaseId });
      const lrc = r.lrc?.lyric || r.data?.lrc?.lyric || '';
      if (!lrc.trim()) { dispatch({ type: 'CLEAR_LYRICS' }); return; }
      dispatch({ type: 'SET_LYRICS', payload: lrc });
    } catch (e) { dispatch({ type: 'CLEAR_LYRICS' }); }
  }, []);

  useEffect(() => {
    if (!state.lyricsLines.length) return;
    const t = state.currentTime;
    let idx = -1;
    for (let i = state.lyricsLines.length - 1; i >= 0; i--) {
      if (t >= state.lyricsLines[i].time) { idx = i; break; }
    }
    if (idx !== state.currentLyricIndex) {
      dispatch({ type: 'SET_LYRIC_INDEX', payload: idx });
    }
  }, [state.currentTime, state.lyricsLines]);

  // Fetch lyrics when song changes
  useEffect(() => {
    const song = state.currentSong;
    if (song && song.source === 'netease' && song.netease_id) {
      fetchLyrics(song.netease_id);
    } else {
      dispatch({ type: 'CLEAR_LYRICS' });
    }
  }, [state.currentSong?.netease_id]);

  return { fetchLyrics };
}

// ── TTS Engine ──
function useTTS(state, dispatch, onEnd) {
  const audioRef = useRef(null);
  const queueRef = useRef([]);
  const idxRef = useRef(0);
  const abortRef = useRef(false);
  const doneRef = useRef(false);
  const fallbackVoice = useRef(null);
  const onEndRef = useRef(onEnd);
  onEndRef.current = onEnd;

  const stop = useCallback(() => {
    abortRef.current = true; queueRef.current = []; idxRef.current = 0; doneRef.current = false;
    if (audioRef.current) { audioRef.current.pause(); audioRef.current = null; }
    if ('speechSynthesis' in window) window.speechSynthesis.cancel();
    dispatch({ type: 'SET_DJ_TALKING', payload: false });
  }, []);

  const _playChunk = useCallback(() => {
    if (abortRef.current || idxRef.current >= queueRef.current.length) {
      dispatch({ type: 'SET_DJ_TALKING', payload: false });
      if (onEndRef.current) onEndRef.current();
      return;
    }
    const url = queueRef.current[idxRef.current];
    idxRef.current++;
    const a = new Audio(url);
    audioRef.current = a;
    a.onended = () => {
      URL.revokeObjectURL(url);
      if (idxRef.current < queueRef.current.length) _playChunk();
      else if (doneRef.current) { dispatch({ type: 'SET_DJ_TALKING', payload: false }); if (onEndRef.current) onEndRef.current(); }
    };
    a.onerror = () => {
      URL.revokeObjectURL(url);
      if (idxRef.current < queueRef.current.length) _playChunk();
      else { dispatch({ type: 'SET_DJ_TALKING', payload: false }); if (onEndRef.current) onEndRef.current(); }
    };
    a.play().catch(() => {});
  }, []);

  const _fallback = useCallback((text, mood) => {
    if (!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    if (!text) { dispatch({ type: 'SET_DJ_TALKING', payload: false }); if (onEndRef.current) onEndRef.current(); return; }
    // Strip [em:word] SSML markers — these are for Volcano TTS only
    const cleanText = text.replace(/\[em:[^\]]*\]/g, '').replace(/\s+/g, ' ').trim();
    if (!cleanText) { dispatch({ type: 'SET_DJ_TALKING', payload: false }); if (onEndRef.current) onEndRef.current(); return; }
    const u = new SpeechSynthesisUtterance(cleanText);
    const lang = detectSpeechLang(cleanText);
    u.lang = lang; u.volume = 0.85;
    const presets = { energetic: { rate: 1.08, pitch: 1.15 }, chill: { rate: 0.9, pitch: 0.95 }, melancholy: { rate: 0.85, pitch: 0.85 }, playful: { rate: 1.05, pitch: 1.1 }, nostalgic: { rate: 0.88, pitch: 0.9 }, default: { rate: 0.95, pitch: 1.0 } };
    const p = presets[mood] || presets['default'];
    u.rate = p.rate; u.pitch = p.pitch;
    const voices = speechSynthesis.getVoices();
    const langPrefix = lang.split('-')[0].toLowerCase();
    const matchedVoice = voices.find(v => v.lang.toLowerCase().startsWith(langPrefix))
      || fallbackVoice.current
      || voices.find(v => v.lang.startsWith('zh') || v.lang.startsWith('en'))
      || null;
    if (matchedVoice) u.voice = matchedVoice;
    u.onend = () => { dispatch({ type: 'SET_DJ_TALKING', payload: false }); if (onEndRef.current) onEndRef.current(); };
    window.speechSynthesis.speak(u);
  }, []);

  const speakStream = useCallback((text, mood) => {
    stop();
    abortRef.current = false; queueRef.current = []; idxRef.current = 0; doneRef.current = false;
    dispatch({ type: 'SET_DJ_TALKING', payload: true });
    fetch('/api/tts/synthesize/stream', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text, mood: mood || 'chill' }) })
      .then(resp => {
        if (!resp.ok) { _fallback(text, mood); return; }
        const reader = resp.body.getReader();
        const decoder = new TextDecoder(); let buffer = '';
        function readLoop() {
          if (abortRef.current) { reader.cancel(); return; }
          reader.read().then(({ value, done }) => {
            if (done) return;
            buffer += decoder.decode(value, { stream: true });
            const lines = buffer.split('\n'); buffer = lines.pop() || '';
            for (const line of lines) {
              if (line.startsWith('data: ')) {
                const b64 = line.slice(6).trim(); if (!b64) continue;
                try {
                  const bin = atob(b64);
                  const bytes = new Uint8Array(bin.length);
                  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
                  const blob = new Blob([bytes], { type: 'audio/mpeg' });
                  queueRef.current.push(URL.createObjectURL(blob));
                  if (queueRef.current.length === 1) _playChunk();
                } catch (e) {}
              } else if (line.startsWith('event: done')) {
                doneRef.current = true;
              }
            }
            readLoop();
          }).catch(() => { _fallback(text, mood); });
        }
        readLoop();
      }).catch(() => { _fallback(text, mood); });
  }, [stop, _playChunk, _fallback]);

  const speakHttp = useCallback((text, mood) => {
    stop();
    dispatch({ type: 'SET_DJ_TALKING', payload: true });
    fetch('/api/tts/synthesize', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text, mood: mood || 'chill' }) })
      .then(resp => { if (!resp.ok) throw new Error('status ' + resp.status); return resp.blob(); })
      .then(blob => {
        const url = URL.createObjectURL(blob);
        const a = new Audio(url); audioRef.current = a;
        a.onended = () => { URL.revokeObjectURL(url); dispatch({ type: 'SET_DJ_TALKING', payload: false }); if (onEndRef.current) onEndRef.current(); };
        a.onerror = () => { URL.revokeObjectURL(url); _fallback(text, mood); };
        a.play();
      }).catch(() => { _fallback(text, mood); });
  }, [stop, _fallback]);

  const speak = useCallback((text, mood) => {
    if (!text) return;
    stop();
    if (text.length > 20) speakStream(text, mood);
    else speakHttp(text, mood);
  }, [stop, speakStream, speakHttp]);

  // Preload voices
  useEffect(() => {
    if ('speechSynthesis' in window) {
      speechSynthesis.getVoices();
      speechSynthesis.onvoiceschanged = () => {
        const voices = speechSynthesis.getVoices();
        fallbackVoice.current = voices.find(v => v.lang.startsWith('zh-CN') || v.lang.startsWith('zh-TW')) || null;
      };
    }
  }, []);

  return { speak, stop };
}

// ── Interjections (SSE) ──
function useInterjections(state, dispatch, ttsSpeak) {
  const evRef = useRef(null);
  const lastTs = useRef(0);

  useEffect(() => {
    function connect() {
      if (evRef.current) evRef.current.close();
      const es = new EventSource('/api/agent/stream');
      evRef.current = es;
      es.addEventListener('interjection', (e) => {
        try {
          const i = JSON.parse(e.data);
          if (!i.say) return;
          if (lastTs.current && Date.now() - lastTs.current < 10000) return;
          if (state.appState === 'speaking') return;
          lastTs.current = Date.now();
          const iText = (i.say || '').replace(/\[em:[^\]]*\]/g, '');
          dispatch({ type: 'SET_SPEECH', payload: { text: iText, segue: null, reason: i.reason || '', showReactions: false } });
          ttsSpeak(i.say, i.mood);
        } catch (_) {}
      });
      es.onerror = () => {
        setTimeout(connect, 5000);
      };
    }
    connect();
    return () => { if (evRef.current) evRef.current.close(); };
  }, [state.appState]);
}

    const t = setInterval(() => {

}

// ── Weather ──
function useWeather(dispatch) {
  const update = useCallback(async () => {
    try {
      const w = await api('/api/weather');
      const m = { '01d': '☀️', '01n': '🌙', '02d': '⛅', '02n': '⛅', '03d': '☁️', '03n': '☁️', '09d': '🌧️', '10d': '🌦️', '11d': '⛈️', '13d': '🌨️', '50d': '🌫️' };
      dispatch({ type: 'SET_WEATHER', payload: { icon: m[w.icon] || '☀️', temp: w.temp + '°', time: w.time || '' } });
    } catch (e) {}
  }, []);
  useEffect(() => { update(); const t = setInterval(update, 600000); return () => clearInterval(t); }, [update]);
  return update;
}

// ── Keyboard Shortcuts ──
function useKeyboardShortcuts(actions) {
  useEffect(() => {
    const h = (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      switch (e.code) {
        case 'Space': e.preventDefault(); actions.togglePlay(); break;
        case 'ArrowRight': actions.next(); break;
        case 'ArrowLeft': actions.prev(); break;
        case 'KeyI': actions.showImport(); break;
        case 'KeyS': actions.showNeteaseSearch(); break;
        case 'KeyP': actions.togglePlaylist(); break;
        case 'Escape': actions.closeAll(); break;
      }
    };
    document.addEventListener('keydown', h);
    return () => document.removeEventListener('keydown', h);
  }, [actions]);
}

// ── New Broadcast Interface ──
const StageProgress = ({ currentTime, duration, waveformRef, onSeek }) => {
  const pct = duration > 0 ? Math.min(100, Math.max(0, (currentTime / duration) * 100)) : 0;
  const laneRef = useRef(null);
  const handleSeek = (e) => {
    if (!laneRef.current) return;
    const rect = laneRef.current.getBoundingClientRect();
    const ratio = Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width));
    onSeek(ratio);
  };

  return (
    <div className="stage-progress">
      <span>{fmtTime(currentTime)}</span>
      <div ref={laneRef} className="wave-lane" onClick={handleSeek}>
        <canvas ref={waveformRef} width="520" height="56" className="stage-wave-canvas" />
        <div className="progress-rail">
          <div className="progress-fill" style={{ width: `${pct}%` }} />
        </div>
      </div>
      <span>{fmtTime(duration)}</span>
    </div>
  );
};

const RhythmDeck = ({ viz, isPlaying }) => {

    return { height, delay: (i % 9) * 0.08 };
  });

  return (
    <div className="rhythm-deck">

const ScriptPaper = ({ state, dispatch, scriptFeed, recCards, onSendChat, onToggleVoiceMode, onPlayRec, onAddRec, onReact }) => {
  const paperRef = useRef(null);
  const particleRefs = useRef([]);
  const particles = useMemo(() => Array.from({ length: 54 }, (_, i) => {
    const row = Math.floor(i / 9);
    const col = i % 9;
    return {
      x: 7 + col * 10.8 + ((row % 2) * 3.2) + Math.sin(i * 1.7) * 1.8,
      y: 9 + row * 13.6 + Math.cos(i * 1.3) * 2.4,
      size: 1.8 + (i % 5) * 0.42,
      opacity: 0.12 + (i % 7) * 0.018,
    };
  }), []);
  const song = state.currentSong || {};
  const fallback = song.title
    ? `现在正在放 ${song.artist || '这位歌手'} 的《${song.title}》。我会把节奏接住，等下一段情绪出现。`
    : 'DJ 正在调台。你可以说一句今天的状态，我来把第一首歌接上。';
  const latestDjLine = (scriptFeed || []).find(item => item.role !== 'user' && item.kind !== 'user');
  const primary = (state.speechText || '').trim() || latestDjLine?.content || fallback;
  const primaryReason = state.reasonText || latestDjLine?.reason || '';
  const history = (scriptFeed || []).filter(item => item.content && item.content !== primary).slice(0, 5);
  const talking = state.isDjTalking || state.appState === 'speaking' || state.appState === 'chatting';
  const handlePointerMove = (e) => {
    const el = paperRef.current;
    if (!el) return;
    const rect = el.getBoundingClientRect();
    const x = ((e.clientX - rect.left) / rect.width) * 100;
    const y = ((e.clientY - rect.top) / rect.height) * 100;
    el.style.setProperty('--sand-x', `${Math.max(0, Math.min(100, x))}%`);
    el.style.setProperty('--sand-y', `${Math.max(0, Math.min(100, y))}%`);
    particleRefs.current.forEach((node, i) => {
      if (!node) return;
      const p = particles[i];
      const dist = Math.hypot(p.x - x, p.y - y);
      const influence = Math.max(0, 1 - dist / 24);
      const scale = 1 + influence * 3.8;
      node.style.setProperty('--p-scale', scale.toFixed(2));
      node.style.setProperty('--p-opacity', (p.opacity + influence * 0.58).toFixed(2));
      node.style.setProperty('--p-blur', `${Math.max(0, 1.2 - influence * 1.1).toFixed(2)}px`);
    });
  };
  const handlePointerLeave = () => {
    const el = paperRef.current;
    if (!el) return;
    el.style.setProperty('--sand-x', '72%');
    el.style.setProperty('--sand-y', '22%');
    particleRefs.current.forEach((node, i) => {
      if (!node) return;
      const p = particles[i];
      node.style.setProperty('--p-scale', '1');
      node.style.setProperty('--p-opacity', String(p.opacity));
      node.style.setProperty('--p-blur', '0px');
    });
  };

  return (
    <section ref={paperRef} className="script-paper" onPointerMove={handlePointerMove} onPointerLeave={handlePointerLeave}>
      <span className="sand-stream s1"></span>
      <span className="sand-stream s2"></span>
      <span className="sand-stream s3"></span>
      {particles.map((p, i) => (
        <span key={i}
          ref={node => { particleRefs.current[i] = node; }}
          className="sand-particle"
          style={{
            '--p-x': `${p.x}%`,
            '--p-y': `${p.y}%`,
            '--p-size': `${p.size}px`,
            '--p-opacity': p.opacity,
          }} />
      ))}
      <div className="script-header">
        <div>
          <div className="script-kicker">DJ Script</div>
          <div className="script-title">说话和串词</div>
        </div>
        <div className="script-badge">{talking ? 'ON AIR' : 'Live Notes'}</div>
      </div>

      <RecommendationStrip cards={recCards} onPlay={onPlayRec} onAdd={onAddRec} />

      <div className="script-body scrollbar-hide">
        <div className="script-current">
          <div className="script-meta">
            <strong>DJ</strong>
            <span>•</span>
            <span>{fmtTime(state.currentTime)}</span>
          </div>
          <div className="script-text">{primary}</div>
          {primaryReason && <div className="script-reason">{primaryReason}</div>}
          {state.showReactions && (
            <div className="mt-3 flex gap-2">
              <button className="script-chip" onClick={() => onReact('like')}>喜欢这首</button>
              <button className="script-chip" onClick={() => onReact('skip')}>跳过</button>
            </div>
          )}
        </div>

        {history.length > 0 && (
          <div className="script-history">
            {history.map(item => (
              <div key={item.id} className={'script-line ' + (item.role || item.kind || 'speech')}>
                <div className="script-meta">
                  <strong>{item.role === 'user' ? 'You' : item.kind === 'chat' ? 'DJ Reply' : 'Cue'}</strong>
                  <span>•</span>
                  <span>{item.time}</span>
                </div>
                <p>{item.content}</p>
              </div>
            ))}
          </div>
        )}
      </div>

      <CompactCommandBar state={state} dispatch={dispatch}
        onSendChat={onSendChat}
        onToggleVoiceMode={onToggleVoiceMode} />
    </section>
  );
};

const PlaylistImportModal = ({ show, onClose, onRefresh, playlistSongs }) => {
  const [pid, setPid] = useState('');
  const [status, setStatus] = useState('');
  const importFn = async () => {
    const match = pid.match(/id[=:]\s*(\d+)/);
    const id = match ? match[1] : pid.replace(/\D/g, '');
    if (!id) { setStatus('请输入有效的歌单ID'); return; }
    setStatus('正在获取...');
    try {
      const r = await api('/api/netease/playlist/tracks', 'POST', { id, limit: 500 });
      const tracks = r.songs || r.data?.songs || r.playlist?.tracks || [];
      if (!tracks.length) { setStatus('歌单为空或需Cookie'); return; }
      const existingIds = new Set((playlistSongs || []).filter(s => s.source === 'netease' && s.netease_id).map(s => String(s.netease_id)));
      const importSongs = [];
      for (const t of tracks) {
        if (existingIds.has(String(t.id))) continue;
        const artists = (t.ar || t.artists || []).map(a => a.name).join(' / ');
        importSongs.push({ source: 'netease', netease_id: t.id, path: '', title: t.name, artist: artists, album: t.al?.name || t.album?.name || '', duration: Math.floor((t.dt || t.duration || 0) / 1000), tags: [], cover: t.al?.picUrl || t.album?.picUrl || '' });
      }
      const r2 = await api('/api/playlist/import', 'POST', { songs: importSongs });
      onRefresh(); setStatus(`导入完成！新增 ${r2.added} 首`);
      setTimeout(onClose, 2000);
    } catch (e) { setStatus('导入失败: ' + e.message); }
  };
  return (
    <div className={'modal-overlay ' + (show ? 'show' : '')} onClick={e => { if (e.target.classList.contains('modal-overlay')) onClose(); }}>
      <div className="modal-box">
        <h2>📋 导入网易云歌单</h2>
        <input type="text" value={pid} onChange={e => setPid(e.target.value)} onKeyDown={e => e.key === 'Enter' && importFn()} placeholder="输入歌单链接或ID" />
        <div className="flex justify-between mt-4">
          <span className="text-xs text-gray-500 self-center">{status}</span>
          <div className="flex gap-2">
            <button className="btn btn-ghost" onClick={onClose}>取消</button>
            <button className="btn btn-grad" onClick={importFn}>导入</button>
          </div>
        </div>
      </div>
    </div>
  );
};

const LikesModal = ({ show, onClose, onRefresh, playlistSongs }) => {

    setStatus('正在获取...');
    try {
      const r = await api('/api/netease/likelist', 'POST', {});
      const ids = r.ids || r.data?.ids || [];
      if (!ids.length) { setStatus('获取失败，请检查Cookie和UID配置'); return; }
      setStatus(`找到 ${ids.length} 首，获取详情中...`);
      const existingIds = new Set((playlistSongs || []).filter(s => s.source === 'netease' && s.netease_id).map(s => String(s.netease_id)));
      const importSongs = [];
      for (let i = 0; i < ids.length; i += 50) {
        const batch = ids.slice(i, i + 50).join(',');
        const detail = await api('/api/netease/song/detail', 'POST', { ids: batch });
        const songs = detail.songs || detail.data?.songs || [];
        for (const song of songs) {
          if (existingIds.has(String(song.id))) continue;
          const artists = (song.ar || song.artists || []).map(a => a.name).join(' / ');
          importSongs.push({ source: 'netease', netease_id: song.id, path: '', title: song.name, artist: artists, album: song.al?.name || '', duration: Math.floor((song.dt || 0) / 1000), tags: [], cover: song.al?.picUrl || '' });
        }
      }
      const r2 = await api('/api/playlist/import', 'POST', { songs: importSongs });
      onRefresh(); setStatus(`导入完成！新增 ${r2.added} 首`);
      setTimeout(onClose, 2000);
    } catch (e) { setStatus('失败: ' + e.message); }
  };
  return (
    <div className={'modal-overlay ' + (show ? 'show' : '')} onClick={e => { if (e.target.classList.contains('modal-overlay')) onClose(); }}>
      <div className="modal-box">
        <h2>❤️ 导入我喜欢的歌</h2>
        <p className="text-gray-400 text-xs mb-4">从网易云收藏中导入所有「我喜欢的音乐」</p>

          <span className="text-xs text-gray-500 self-center">{status}</span>
          <div className="flex gap-2">
            <button className="btn btn-ghost" onClick={onClose}>取消</button>
