      <div className="absolute bottom-0 left-0 right-0 p-3 border-t border-white/5 flex gap-1.5 flex-wrap" style={{ background: 'rgba(8,8,20,0.9)' }}>
        <button className="btn btn-ghost text-[10px] py-1 px-2" onClick={onImport}>📁 导入</button>
        <button className="btn btn-ghost text-[10px] py-1 px-2" onClick={onSearch}>☁️ 搜索</button>
        <button className="btn btn-ghost text-[10px] py-1 px-2" onClick={onImportPlaylist}>📋 歌单</button>
        <button className="btn btn-ghost text-[10px] py-1 px-2" onClick={onLikes}>❤️ 喜欢</button>
      </div>
    </div>
  );
};

/* ═════════════════════════════════════════════════
 * 6. Main App
 * ═════════════════════════════════════════════════ */
function App() {
  const [state, dispatch] = useReducer(reducer, initialState);
  const audioRef = useRef(document.getElementById('audioPlayer'));
  const stateRef = useRef(initialState);
  stateRef.current = state;
  const audioActionsRef = useRef(null);
  const [playlistOpen, setPlaylistOpen] = useState(false);
  const [modal, setModal] = useState({ import: false, search: false, playlist: false, likes: false });
  const [searchInitKw, setSearchInitKw] = useState('');
  const [recCards, setRecCards] = useState([]);
  const [djScriptFeed, setDjScriptFeed] = useState([]);
  const transitionTokenRef = useRef(0);
  const transitionTimerRef = useRef(null);
  const executeActionsRef = useRef(null);
  const playDirectSongRef = useRef(null);
  const chatVoiceRef = useRef({
    sessionId: 0,
    queue: [],
    player: null,
    streamDone: true,
    waiters: [],
  });

  const audioActions = useAudioPlayer(audioRef, state, dispatch);
  audioActionsRef.current = audioActions;
  const viz = useAudioVisualizer(audioRef, state.isPlaying);

  const cancelTransitionFallback = useCallback(() => {
    transitionTokenRef.current += 1;
    if (transitionTimerRef.current) {
      clearTimeout(transitionTimerRef.current);
      transitionTimerRef.current = null;
    }
  }, []);

  const scheduleTransitionFallback = useCallback((token, timeoutMs, onTimeout) => {
    if (transitionTimerRef.current) {
      clearTimeout(transitionTimerRef.current);
    }
    transitionTimerRef.current = setTimeout(() => {
      transitionTimerRef.current = null;
      if (token !== transitionTokenRef.current) return;
      onTimeout();
    }, timeoutMs);
  }, []);

  const resolveChatVoiceWaiters = useCallback(() => {
    const st = chatVoiceRef.current;
    if (!st.streamDone || st.queue.length > 0 || st.player) return;
    const waiters = st.waiters.splice(0, st.waiters.length);
    for (const w of waiters) {
      try { w.resolve(); } catch (e) {}
    }
  }, []);

  const playNextChatVoice = useCallback((sessionId) => {
    const st = chatVoiceRef.current;
    if (st.sessionId !== sessionId) return;
    if (st.player || st.queue.length === 0) {
      resolveChatVoiceWaiters();
      return;
    }
    const url = st.queue.shift();
    const audio = new Audio(url);
    st.player = audio;
    let settled = false;
    const finalize = () => {
      if (settled) return;
      settled = true;
      try { URL.revokeObjectURL(url); } catch (e) {}
      const cur = chatVoiceRef.current;
      if (cur.sessionId !== sessionId) return;
      cur.player = null;
      if (cur.queue.length > 0) playNextChatVoice(sessionId);
      else resolveChatVoiceWaiters();
    };
    audio.onended = finalize;
    audio.onerror = finalize;
    audio.play().catch(finalize);
  }, [resolveChatVoiceWaiters]);

  const markChatVoiceStreamDone = useCallback((sessionId) => {
    const st = chatVoiceRef.current;
    if (st.sessionId !== sessionId) return;
    st.streamDone = true;
    if (st.queue.length === 0 && !st.player) resolveChatVoiceWaiters();
  }, [resolveChatVoiceWaiters]);

  const stopChatVoice = useCallback(() => {
    const st = chatVoiceRef.current;
    st.sessionId += 1;
    if (st.player) {
      st.player.onended = null;
      st.player.onerror = null;
      try { st.player.pause(); } catch (e) {}
      st.player = null;
    }
    for (const url of st.queue) {
      try { URL.revokeObjectURL(url); } catch (e) {}
    }
    st.queue = [];
    st.streamDone = true;
    const waiters = st.waiters.splice(0, st.waiters.length);
    for (const w of waiters) {
      try { w.resolve(); } catch (e) {}
    }
  }, []);

  const waitForChatVoiceDrain = useCallback((sessionId) => {
    const st = chatVoiceRef.current;
    if (st.sessionId !== sessionId) return Promise.resolve();
    if (st.streamDone && st.queue.length === 0 && !st.player) return Promise.resolve();
    return new Promise((resolve) => {
      st.waiters.push({ sessionId, resolve });
    });
  }, []);

  const enqueueChatVoiceChunk = useCallback((sessionId, base64Chunk) => {
    const st = chatVoiceRef.current;
    if (st.sessionId !== sessionId || !base64Chunk) return;
    try {
      const bin = atob(base64Chunk);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      const blob = new Blob([bytes], { type: 'audio/mpeg' });
      st.queue.push(URL.createObjectURL(blob));
      playNextChatVoice(sessionId);
    } catch (e) {}
  }, [playNextChatVoice]);

  const uiAudioActions = useMemo(() => ({
    ...audioActions,
    loadSong: (idx) => {
      cancelTransitionFallback();
      dispatch({ type: 'SET_PENDING_TRANSITION', payload: false });
      dispatch({ type: 'SET_PENDING_SONG', payload: null });
      dispatch({ type: 'SET_PENDING_NEXT', payload: false });
      audioActions.loadSong(idx);
    },
    nextTrack: () => {
      cancelTransitionFallback();
      dispatch({ type: 'SET_PENDING_TRANSITION', payload: false });
      dispatch({ type: 'SET_PENDING_SONG', payload: null });
      dispatch({ type: 'SET_PENDING_NEXT', payload: false });
      audioActions.nextTrack();
    },
    prevTrack: () => {
      cancelTransitionFallback();
      dispatch({ type: 'SET_PENDING_TRANSITION', payload: false });
      dispatch({ type: 'SET_PENDING_SONG', payload: null });
      dispatch({ type: 'SET_PENDING_NEXT', payload: false });
      audioActions.prevTrack();
    },
  }), [audioActions, cancelTransitionFallback]);

  const loadMaterializedSong = useCallback((song, idx = -1) => {
    if (!song) return;
    dispatch({ type: 'SET_TRANSITION_TRIGGERED', payload: false });
    dispatch({ type: 'SET_PENDING_TRANSITION', payload: false });
    dispatch({ type: 'SET_CURRENT_SONG', payload: song });
    dispatch({ type: 'SET_CURRENT_INDEX', payload: idx });
    dispatch({ type: 'SET_DIRECT_PLAY', payload: { direct: false, song: null } });
    const audio = audioRef.current;
    if (!audio) return;
    if ((song.source === 'netease' || song.source === 'netease_discovery') && song.netease_id) {
      audio.src = `/api/audio?source=netease&netease_id=${song.netease_id}&proxy=1`;
    } else {
      audio.src = `/api/audio?path=${encodeURIComponent(song.path || '')}`;
    }
    audio.load();
    if (idx >= 0) {
      api('/api/playlist/current', 'POST', { index: idx }).catch(() => {});
      api('/api/stats/song-play', 'POST', { song_index: idx }).catch(() => {});
    }
  }, []);

  const loadPendingSong = useCallback(() => {
    cancelTransitionFallback();
    const latest = stateRef.current;
    const song = latest.pendingSong;
    const songs = latest.playlist?.songs || [];

    if (song) {
      dispatch({ type: 'SET_PENDING_NEXT', payload: false });
      dispatch({ type: 'SET_PENDING_TRANSITION', payload: false });
      dispatch({ type: 'SET_PENDING_SONG', payload: null });
      dispatch({ type: 'CLEAR_SPEECH' });
      let idx = song.playlist_index ?? -1;
      if (idx < 0 || idx >= songs.length) idx = -1;
      if (idx < 0 && song.netease_id) idx = songs.findIndex(s => String(s.netease_id) === String(song.netease_id));
      if (idx < 0) idx = songs.findIndex(s => s.title === song.title && s.artist === song.artist);
      if (idx >= 0) {
        audioActions.loadSong(idx);
        setTimeout(() => audioActions.play(), 200);
      } else if (song.netease_id) {
        const ns = {
          title: song.title,
          artist: song.artist,
          netease_id: song.netease_id,
          source: song.source || 'netease',
          cover: song.cover_url || song.album_pic || '',
          album: song.album_name || '',
          cover_url: song.cover_url || song.album_pic || '',
          tags: [],
          path: song.path || '',
        };
        const newSongs = [...songs, ns];
        dispatch({ type: 'SET_PLAYLIST', payload: { songs: newSongs, current_index: latest.playlist?.current_index ?? -1 } });
        idx = newSongs.length - 1;
        loadMaterializedSong(ns, idx);
        api('/api/playlist/add', 'POST', { song: ns }).catch(() => {});
        api('/api/playlist/current', 'POST', { index: idx }).catch(() => {});
        setTimeout(() => audioActions.play(), 300);
      } else {
        audioActions.nextTrack();
      }
      return;
    }

    if (latest.pendingNext || latest.pendingTransition) {
      dispatch({ type: 'SET_PENDING_NEXT', payload: false });
      dispatch({ type: 'SET_PENDING_TRANSITION', payload: false });
      dispatch({ type: 'SET_PENDING_SONG', payload: null });
      dispatch({ type: 'CLEAR_SPEECH' });
      dispatch({ type: 'SET_TRANSITION_TRIGGERED', payload: false });
      audioActions.nextTrack();
      return;
    }
    dispatch({ type: 'SET_PENDING_NEXT', payload: false });
    dispatch({ type: 'SET_PENDING_TRANSITION', payload: false });
    dispatch({ type: 'SET_PENDING_SONG', payload: null });
    dispatch({ type: 'CLEAR_SPEECH' });
  }, [audioActions, cancelTransitionFallback, loadMaterializedSong]);

  const handleTtsEnd = useCallback(() => {
    cancelTransitionFallback();
    dispatch({ type: 'SET_DJ_TALKING', payload: false });
    dispatch({ type: 'SET_APP_STATE', payload: 'idle' });
    loadPendingSong();
  }, [loadPendingSong, cancelTransitionFallback]);

  const tts = useTTS(state, dispatch, handleTtsEnd);
  const { fetchLyrics } = useLyrics(state, dispatch);

  useInterjections(state, dispatch, tts.speak);
  useStatsTicker(state.isPlaying, state.playlist);
  useWeather(dispatch);

  useEffect(() => {
    if (state.appState !== 'idle' || state.isDjTalking) return;
    if (state.pendingSong) {
      const id = setTimeout(() => loadPendingSong(), 80);
      return () => clearTimeout(id);
    }
    if (state.pendingNext) {
      if (state.currentMode === 'dj') {
        dispatch({ type: 'SET_PENDING_NEXT', payload: false });
        dispatch({ type: 'SET_PENDING_TRANSITION', payload: true });
      } else {
        const id = setTimeout(() => loadPendingSong(), 80);
        return () => clearTimeout(id);
      }
    }
    if (state.pendingTransition && state.currentMode === 'dj') {
      dispatch({ type: 'SET_PENDING_TRANSITION', payload: false });
      dispatch({ type: 'SET_TRANSITION_TRIGGERED', payload: true });
    }
  }, [state.appState, state.isDjTalking, state.pendingSong, state.pendingNext, state.pendingTransition, state.currentMode, loadPendingSong]);

  useEffect(() => {
    const text = (state.speechText || '').trim();
    if (!text) return;
    setDjScriptFeed(prev => {
      if (prev[0]?.content === text) {
        return [{ ...prev[0], reason: state.reasonText || prev[0].reason || '' }, ...prev.slice(1)];
      }
      return [{
        id: 'speech-' + Date.now(),
        kind: 'speech',
        content: text,
        reason: state.reasonText || '',
        time: new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' }),
      }, ...prev].slice(0, 10);
    });
  }, [state.speechText, state.reasonText]);

  useEffect(() => {
    const lastMessage = [...(state.chatHistory || [])].reverse().find(m => (m.content || '').trim());
    if (!lastMessage) return;
    const text = lastMessage.content.trim();
    setDjScriptFeed(prev => {
      if (prev.some(item => item.content === text && item.role === lastMessage.role)) return prev;
      return [{
        id: 'chat-' + lastMessage.role + '-' + Date.now(),
        kind: lastMessage.role === 'user' ? 'user' : 'chat',
        role: lastMessage.role,
        content: text,
        reason: '',
        time: new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' }),
      }, ...prev].slice(0, 10);
    });
  }, [state.chatHistory]);

  const chooseStartupIndex = useCallback((playlistData) => {
    const songs = playlistData?.songs || [];
    if (!songs.length) return -1;
    const savedIndex = Number(playlistData.current_index);
    if (Number.isInteger(savedIndex) && savedIndex > 0 && savedIndex < songs.length) return savedIndex;
    if (songs.length === 1) return 0;
    let idx = Math.floor(Math.random() * songs.length);
    if (idx === 0) idx = 1 + Math.floor(Math.random() * (songs.length - 1));
    return idx;
  }, []);

  const runOpeningShow = useCallback(async (playlistData, startupIndex) => {
    const songs = playlistData?.songs || [];
    const anchor = songs[startupIndex] || songs[0] || null;
    if (!anchor) {
      const say = '嘿，欢迎回来。先导入一点歌，我就能开始给你开台。';
      dispatch({ type: 'SET_APP_STATE', payload: 'speaking' });
      dispatch({ type: 'SET_SPEECH', payload: { text: say, segue: null, reason: '等待歌单后开始推荐', showReactions: false } });
      dispatch({ type: 'ADD_CHAT_MESSAGE', payload: { role: 'assistant', content: say } });
      tts.speak(say, 'chill');
      return;
    }

    cancelTransitionFallback();
    const openingToken = transitionTokenRef.current;
    dispatch({ type: 'SET_CURRENT_SONG', payload: anchor });
    dispatch({ type: 'SET_CURRENT_INDEX', payload: startupIndex >= 0 ? startupIndex : 0 });
    dispatch({ type: 'SET_PENDING_TRANSITION', payload: false });
    dispatch({ type: 'SET_PENDING_NEXT', payload: false });
    dispatch({ type: 'SET_TRANSITION_TRIGGERED', payload: false });

    const fallbackSong = { ...anchor, playlist_index: startupIndex >= 0 ? startupIndex : 0 };
    const fallbackSay = `嘿，欢迎回来。我先从 ${anchor.artist || '这位歌手'} 的《${anchor.title || '这首歌'}》开场，然后慢慢往外探一点新东西。`;
    try {
      const chatContext = [
        '开台：用户刚打开私人电台。',
        '请先自然打招呼，再发散推荐一首开场歌。',
        '不要只从用户喜欢/红心/常听歌手里选；优先考虑网易云实时发现、不同语种、不同风格，但仍要适合当前氛围。',
        '串词里要让用户感觉你是在聊天，不是机械播报。',
      ].join('\n');
      const r = await api('/api/agent/transition', 'POST', {
        current_song: anchor,
        weather: {
          description: stateRef.current.weather?.description || '',
          icon: stateRef.current.weather?.iconCode || '',
          temp: stateRef.current.weather?.temp,
        },
        history: stateRef.current.recentTransitions || [],
        user_activity: stateRef.current.userActivity || '',
        chat_context: chatContext,
      });
      const selected = r?.selected_song && r.action === 'play_selected'
        ? r.selected_song
        : fallbackSong;
      const say = (r?.say || fallbackSay).replace(/\[em:[^\]]*\]/g, '');
      const reason = r?.reason || '开台推荐：先打招呼，再给你推一首不只来自喜欢列表的歌。';
      dispatch({ type: 'SET_PENDING_SONG', payload: selected });
      dispatch({ type: 'SET_APP_STATE', payload: 'speaking' });
      dispatch({ type: 'SET_MOOD', payload: r?.mood || 'chill' });
      dispatch({ type: 'SET_SPEECH', payload: { text: say, segue: r?.segue || null, reason, showReactions: true } });
      dispatch({ type: 'ADD_CHAT_MESSAGE', payload: { role: 'assistant', content: say } });
      const openingCard = {
        title: selected.title || anchor.title || '开场歌',
        artist: selected.artist || anchor.artist || '',
        netease_id: selected.netease_id || '',
        cover: selected.cover_url || selected.album_pic || selected.cover || anchor.cover || anchor.cover_url || '',
        reason: '开台推荐',
      };
      setRecCards(prev => [...prev, openingCard].slice(-8));
      tts.speak(r?.say || say, r?.mood || 'chill');
      scheduleTransitionFallback(openingToken, (say.length || 16) * 350 + 9000, () => {
        if (!stateRef.current.pendingSong) return;
        dispatch({ type: 'SET_DJ_TALKING', payload: false });
        dispatch({ type: 'SET_APP_STATE', payload: 'idle' });
        loadPendingSong();
      });
    } catch (e) {
      dispatch({ type: 'SET_PENDING_SONG', payload: fallbackSong });
      dispatch({ type: 'SET_APP_STATE', payload: 'speaking' });
      dispatch({ type: 'SET_MOOD', payload: 'chill' });
      dispatch({ type: 'SET_SPEECH', payload: { text: fallbackSay, segue: null, reason: '开台兜底推荐', showReactions: false } });
      dispatch({ type: 'ADD_CHAT_MESSAGE', payload: { role: 'assistant', content: fallbackSay } });
      tts.speak(fallbackSay, 'chill');
      scheduleTransitionFallback(openingToken, (fallbackSay.length || 16) * 350 + 9000, () => {
        if (!stateRef.current.pendingSong) return;
        dispatch({ type: 'SET_DJ_TALKING', payload: false });
        dispatch({ type: 'SET_APP_STATE', payload: 'idle' });
        loadPendingSong();
      });
    }
  }, [tts, cancelTransitionFallback, scheduleTransitionFallback, loadPendingSong]);

  useEffect(() => {
    (async () => {
      try { const s = await api('/api/status'); } catch (e) {}
      try { const pl = await api('/api/playlist'); dispatch({ type: 'SET_PLAYLIST', payload: pl }); } catch (e) {}
      const saved = localStorage.getItem('dj_activity') || '';
      if (saved) dispatch({ type: 'SET_USER_ACTIVITY', payload: saved });
      const savedVoiceMode = localStorage.getItem('dj_voice_mode');
      if (savedVoiceMode === 'realtime' || savedVoiceMode === 'tts') {
        dispatch({ type: 'SET_VOICE_MODE', payload: savedVoiceMode });
      }
      dispatch({ type: 'SET_MODE', payload: 'dj' });
      let mode = 'dj';
      try { const m = await api('/api/mode'); mode = (m && m.mode) ? m.mode : 'dj'; } catch (e) {}
      dispatch({ type: 'SET_MODE', payload: mode });

      setTimeout(async () => {
        if (mode !== 'dj') return;
        const pl = await api('/api/playlist').catch(() => ({ songs: [], current_index: -1 }));
        const startupIndex = chooseStartupIndex(pl);
        await runOpeningShow(pl, startupIndex);
      }, 800);
    })();
  }, []);

  useEffect(() => {
    return () => {
      if (transitionTimerRef.current) {
        clearTimeout(transitionTimerRef.current);
        transitionTimerRef.current = null;
      }
    };
  }, []);

  useEffect(() => {
    return () => {
      stopChatVoice();
    };
  }, [stopChatVoice]);

  // (Lyrics fetching is handled by useLyrics hook, no duplicate needed)

  // Init visualizer on first play
  useEffect(() => {
    if (state.isPlaying) viz.init();
  }, [state.isPlaying]);

// Transition
const doTransition = useCallback(async () => {
  cancelTransitionFallback();
  if (state.appState !== 'idle' || state.isDjTalking) {
    dispatch({ type: 'SET_TRANSITION_TRIGGERED', payload: false });
    dispatch({ type: 'SET_PENDING_TRANSITION', payload: true });
    return;
  }
  const songs = state.playlist.songs;
  const cur = state.playlist.current_index;
  const safeCur = cur >= 0 && cur < songs.length
    ? cur
    : Math.max(0, songs.findIndex(s => {
      const curSong = state.currentSong || {};
      return (curSong.netease_id && String(s.netease_id) === String(curSong.netease_id))
        || (s.title === curSong.title && s.artist === curSong.artist);
    }));
  const currentForTransition = state.currentSong || songs[safeCur] || {};
  const transitionToken = transitionTokenRef.current;
  dispatch({ type: 'SET_TRANSITION_TRIGGERED', payload: false });
  dispatch({ type: 'SET_PENDING_TRANSITION', payload: false });
  dispatch({ type: 'SET_PENDING_NEXT', payload: false });
  dispatch({ type: 'SET_PENDING_SONG', payload: null });
  if (songs.length < 2 || state.currentMode === 'normal') { dispatch({ type: 'SET_APP_STATE', payload: 'idle' }); return; }
  dispatch({ type: 'SET_APP_STATE', payload: 'speaking' });
  try {
    const chatCtx = (state.chatHistory || []).slice(-4).map(m => `${m.role === 'user' ? '用户' : 'DJ'}：${m.content}`).join('\n');
    const r = await api('/api/agent/transition', 'POST', {
      current_song: currentForTransition,
      weather: {
        description: state.weather.description || '',
        icon: state.weather.iconCode || '',
        temp: state.weather.temp,
      },
      history: state.recentTransitions || [],
      user_activity: state.userActivity || '',
      chat_context: chatCtx,
    });
    if (stateRef.current.appState !== 'speaking') return;
    if (r.say) {
      const displayText = (r.say || '').replace(/\[em:[^\]]*\]/g, '');
      dispatch({ type: 'SET_SPEECH', payload: { text: displayText, segue: r.segue, reason: r.reason, showReactions: true } });
      if (r.mood) dispatch({ type: 'SET_MOOD', payload: r.mood });
      dispatch({ type: 'ADD_TRANSITION', payload: displayText });
      if (r.selected_song && r.action === 'play_selected') dispatch({ type: 'SET_PENDING_SONG', payload: r.selected_song });
      tts.speak(r.say, r.mood);
      const timeoutMs = (r.say?.length || 10) * 350 + 8000;
      const fallbackIdx = (safeCur + 1) % songs.length;
      scheduleTransitionFallback(transitionToken, timeoutMs, () => {
        if (stateRef.current.pendingSong || stateRef.current.pendingNext || stateRef.current.pendingTransition) {
          dispatch({ type: 'SET_DJ_TALKING', payload: false });
          dispatch({ type: 'SET_APP_STATE', payload: 'idle' });
          loadPendingSong();
          return;
        }
        dispatch({ type: 'SET_PENDING_SONG', payload: null });
        dispatch({ type: 'SET_PENDING_NEXT', payload: false });
        dispatch({ type: 'SET_PENDING_TRANSITION', payload: false });
        dispatch({ type: 'SET_DJ_TALKING', payload: false });
        dispatch({ type: 'SET_APP_STATE', payload: 'idle' });
        dispatch({ type: 'CLEAR_SPEECH' });
        dispatch({ type: 'SET_TRANSITION_TRIGGERED', payload: false });
        if (audioActionsRef.current) {
          audioActionsRef.current.loadSong(fallbackIdx);
          setTimeout(() => audioActionsRef.current.play(), 200);
        }
      });
    } else {
      dispatch({ type: 'SET_TRANSITION_TRIGGERED', payload: false });
      dispatch({ type: 'SET_PENDING_TRANSITION', payload: false });
      audioActions.nextTrack();
    }
  } catch (e) {
    const ns = songs[(safeCur + 1) % songs.length] || {};
    const fallbacks = [
      '这首歌的情绪刚刚好，我们顺着感觉继续。',
      '我先把节奏接稳，下一首会更顺。',
      '如果你想换个味道，随时告诉我。',
      '我来切一首更贴合现在氛围的。'
    ];
    const say = fallbacks[Math.floor(Math.random() * fallbacks.length)];
    dispatch({ type: 'SET_SPEECH', payload: { text: say, segue: null, reason: '', showReactions: false } });
    tts.speak(say, 'chill');
    scheduleTransitionFallback(transitionToken, 6000, () => {
      dispatch({ type: 'SET_PENDING_SONG', payload: null });
      dispatch({ type: 'SET_PENDING_NEXT', payload: false });
      dispatch({ type: 'SET_PENDING_TRANSITION', payload: false });
      dispatch({ type: 'SET_DJ_TALKING', payload: false });
      dispatch({ type: 'SET_APP_STATE', payload: 'idle' });
      dispatch({ type: 'CLEAR_SPEECH' });
      dispatch({ type: 'SET_TRANSITION_TRIGGERED', payload: false });
      audioActions.nextTrack();
    });
  }
}, [state.playlist, state.currentSong, state.currentMode, state.chatHistory, state.recentTransitions, state.userActivity, state.weather, state.appState, state.isDjTalking, tts, audioActions, cancelTransitionFallback, scheduleTransitionFallback, loadPendingSong]);

// Chat (with voice TTS)
const sendChat = useCallback(async (msg) => {
  stopChatVoice();
  tts.stop();
  dispatch({ type: 'CLEAR_SPEECH' });
  dispatch({ type: 'SET_APP_STATE', payload: 'chatting' });
  const sessionId = chatVoiceRef.current.sessionId;
  const st = chatVoiceRef.current;
  st.queue = [];
  st.player = null;
  st.streamDone = false;
  st.waiters = [];

  try {
    const curSong = state.currentSong || {};
    const resp = await fetch('/api/agent/chat/voice', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        message: msg,
        history: [...(state.chatHistory || []), { role: 'user', content: msg }],
        voice_mode: state.voiceMode || 'realtime',
        current_song: { title: curSong.title || '', artist: curSong.artist || '' }
      })
    });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const reader = resp.body.getReader();
    const decoder = new TextDecoder(); let buffer = ''; let fullText = '';
    while (true) {
      if (chatVoiceRef.current.sessionId !== sessionId) {
        try { await reader.cancel(); } catch (e) {}
        return;
      }
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n'); buffer = lines.pop() || '';
      let lastEvent = '';
      for (const line of lines) {
        if (line.startsWith('event: ')) {
          lastEvent = line.slice(7).trim();
          continue;
        }
        if (line.startsWith('data: ')) {
          if (lastEvent === 'done') {
            markChatVoiceStreamDone(sessionId);
            lastEvent = '';
            continue;
          }
          try {
            const raw = line.slice(6).trim();
            if (!raw) {
              lastEvent = '';
              continue;
            }
            const data = JSON.parse(raw);
            if (data.type === 'token') {
              fullText += data.text;
            } else if (data.type === 'audio' && data.data) {
              enqueueChatVoiceChunk(sessionId, data.data);
            }
          } catch (e) {}
          lastEvent = '';
        }
      }
    }
    markChatVoiceStreamDone(sessionId);
    const actions = parseActions(fullText);
    const cleanText = cleanActionText(fullText) || fullText;
    dispatch({ type: 'ADD_CHAT_MESSAGE', payload: { role: 'assistant', content: cleanText } });
    await waitForChatVoiceDrain(sessionId);
    if (chatVoiceRef.current.sessionId !== sessionId) return;
    if (actions.length > 0 && executeActionsRef.current) await executeActionsRef.current(actions);
  } catch (e) {
    if (chatVoiceRef.current.sessionId === sessionId) {
      dispatch({ type: 'ADD_CHAT_MESSAGE', payload: { role: 'assistant', content: '刚刚语音回复有点卡，我先用文字接上。' } });
    }
  } finally {
    markChatVoiceStreamDone(sessionId);
    if (chatVoiceRef.current.sessionId === sessionId) {
      dispatch({ type: 'SET_APP_STATE', payload: 'idle' });
    }
  }
}, [state.chatHistory, state.currentSong, state.voiceMode, stopChatVoice, tts.stop, enqueueChatVoiceChunk, waitForChatVoiceDrain, markChatVoiceStreamDone]);

// Execute Chat Actions
const executeActions = useCallback(async (actions) => {
  for (const act of actions) {
    switch (act.type) {
      case 'skip':
        cancelTransitionFallback();
        tts.stop();
        dispatch({ type: 'CLEAR_SPEECH' });
        dispatch({ type: 'SET_APP_STATE', payload: 'idle' });
        dispatch({ type: 'SET_PENDING_TRANSITION', payload: false });
        dispatch({ type: 'SET_PENDING_SONG', payload: null });
        dispatch({ type: 'SET_PENDING_NEXT', payload: false });
        audioActions.nextTrack();
        break;
      case 'search':
        setSearchInitKw(act.arg || '');
        setModal(m => ({ ...m, search: true }));
        break;
      case 'play': {
        const { title: pTitle, artist: pArtist } = splitTrackArg(act.arg);
        let selectedSong = null;
        let bestIdx = -1;
        let bestScore = 0;
        for (let i = 0; i < state.playlist.songs.length; i++) {
          const s = state.playlist.songs[i];
          const score = trackMatchScore(s, pTitle, pArtist);
          if (score > bestScore) {
            bestIdx = i;
            bestScore = score;
          }
        }
        if (bestIdx >= 0 && bestScore > 0) {
          const s = state.playlist.songs[bestIdx];
          cancelTransitionFallback();
          audioActions.loadSong(bestIdx);
          audioActions.play();
          selectedSong = { title: s.title || '', artist: s.artist || '' };
        }
        if (!selectedSong) {
          try {
            const sr = await api('/api/netease/search', 'POST', { keywords: (pTitle + ' ' + pArtist).trim(), limit: 5 });
            const results = sr?.result?.songs || [];
            if (results.length > 0) {
              const song = results[0];
              const ns = {
                title: song.name,
                artist: (song.artists || song.ar || []).map(a => a.name).join(' / '),
                netease_id: String(song.id),
                source: 'netease',
                cover: song.al?.picUrl || '',
                cover_url: song.al?.picUrl || '',
                album: song.al?.name || '',
                tags: [],
                path: ''
              };
              playDirectSongRef.current?.(ns);
              selectedSong = ns;
            }
          } catch (e) {}
        }
        if (selectedSong) {
          const artistLabel = selectedSong.artist || '未知歌手';
          const titleLabel = selectedSong.title || '未命名曲目';
          const confirmText = `好，安排 ${artistLabel} 的《${titleLabel}》。`;
          dispatch({ type: 'ADD_CHAT_MESSAGE', payload: { role: 'assistant', content: confirmText } });
          tts.speak(confirmText, 'chill');
        }
        break;
      }
      case 'recommend': {
        const rParts = act.arg.split('—');
        const rTitle = (rParts[0] || '').trim();
        const rArtist = (rParts[1] || '').trim();
        if (rTitle) {
          try {
            const sr = await api('/api/netease/search', 'POST', { keywords: rTitle + ' ' + rArtist, limit: 1 });
            const results = sr?.result?.songs || [];
            if (results.length > 0) {
              const s = results[0];
              setRecCards(prev => [...prev, {
                title: s.name,
                artist: (s.artists || s.ar || []).map(a => a.name).join(' / '),
                netease_id: String(s.id),
                cover: s.al?.picUrl || '',
                reason: 'AI DJ 推荐'
              }]);
            } else {
              setRecCards(prev => [...prev, { title: rTitle, artist: rArtist, reason: 'AI DJ 推荐' }]);
            }
          } catch (e) {
            setRecCards(prev => [...prev, { title: rTitle, artist: rArtist, reason: 'AI DJ 推荐' }]);
          }
        }
        break;
      }
      case 'volume': {
        const vol = parseInt(act.arg);
        if (!isNaN(vol) && vol >= 0 && vol <= 100) dispatch({ type: 'SET_VOLUME', payload: vol / 100 });
        break;
      }
    }
  }
}, [state.playlist.songs, tts, audioActions, cancelTransitionFallback]);
executeActionsRef.current = executeActions;
  // Direct play
  const playDirectSong = useCallback((song) => {
    cancelTransitionFallback();
    dispatch({ type: 'SET_PENDING_SONG', payload: null });
    dispatch({ type: 'SET_PENDING_NEXT', payload: false });
    dispatch({ type: 'SET_PENDING_TRANSITION', payload: false });
    dispatch({ type: 'SET_TRANSITION_TRIGGERED', payload: false });
    dispatch({ type: 'SET_DIRECT_PLAY', payload: { direct: true, song } });
    dispatch({ type: 'SET_CURRENT_SONG', payload: song });
    dispatch({ type: 'SET_CURRENT_INDEX', payload: state.playlist.current_index });
    const audio = audioRef.current;
    if (audio) {
      if ((song.source === 'netease' || song.source === 'netease_discovery') && song.netease_id) {
        audio.src = `/api/audio?source=netease&netease_id=${song.netease_id}&proxy=1`;
      } else {
        audio.src = `/api/audio?path=${encodeURIComponent(song.path || '')}`;
      }
      audio.load();
      audioActions.play();
    }
  }, [audioActions, cancelTransitionFallback, state.playlist.current_index]);
  playDirectSongRef.current = playDirectSong;
  // Refresh playlist
  const refreshPlaylist = useCallback(async () => {
    try { const pl = await api('/api/playlist'); dispatch({ type: 'SET_PLAYLIST', payload: pl }); } catch (e) {}
  }, []);
  // Delete song
  const deleteSong = useCallback(async (idx) => {
    try { await api(`/api/playlist/song/${idx}`, 'DELETE'); await refreshPlaylist(); } catch (e) {}
  }, [refreshPlaylist]);
  // Reaction
  const handleReaction = useCallback(async (reaction) => {
    dispatch({ type: 'CLEAR_SPEECH' });
    if (state.playlist.current_index >= 0) {
      api('/api/agent/reaction', 'POST', { song_index: state.playlist.current_index, reaction }).catch(() => {});
    }
    if (reaction === 'skip') {
      cancelTransitionFallback();
      stopChatVoice();
      tts.stop();
      dispatch({ type: 'SET_PENDING_TRANSITION', payload: false });
      dispatch({ type: 'SET_PENDING_SONG', payload: null });
      dispatch({ type: 'SET_PENDING_NEXT', payload: false });
    }
  }, [state.playlist.current_index, tts, cancelTransitionFallback, stopChatVoice]);
  // Mode toggle
  const toggleMode = useCallback(async () => {
    cancelTransitionFallback();
    stopChatVoice();
    tts.stop();
    dispatch({ type: 'SET_PENDING_TRANSITION', payload: false });
    dispatch({ type: 'SET_PENDING_SONG', payload: null });
    dispatch({ type: 'SET_PENDING_NEXT', payload: false });
    dispatch({ type: 'SET_TRANSITION_TRIGGERED', payload: false });
    dispatch({ type: 'CLEAR_SPEECH' });
    dispatch({ type: 'SET_APP_STATE', payload: 'idle' });
    const newMode = state.currentMode === 'dj' ? 'normal' : 'dj';
    dispatch({ type: 'SET_MODE', payload: newMode });
    api('/api/mode', 'POST', { mode: newMode }).catch(() => {});
  }, [state.currentMode, cancelTransitionFallback, stopChatVoice, tts]);

  const toggleVoiceMode = useCallback(() => {
    const nextMode = state.voiceMode === 'realtime' ? 'tts' : 'realtime';
    dispatch({ type: 'SET_VOICE_MODE', payload: nextMode });
    localStorage.setItem('dj_voice_mode', nextMode);
  }, [state.voiceMode]);
  // Keyboard
  const kbActions = useMemo(() => ({
    togglePlay: uiAudioActions.togglePlay,
    next: uiAudioActions.nextTrack,
    prev: uiAudioActions.prevTrack,
    showImport: () => setModal(m => ({ ...m, import: true })),
    showNeteaseSearch: () => setModal(m => ({ ...m, search: true })),
    togglePlaylist: () => setPlaylistOpen(o => !o),
    closeAll: () => { setPlaylistOpen(false); setModal({ import: false, search: false, playlist: false, likes: false }); },
  }), [uiAudioActions]);
  useKeyboardShortcuts(kbActions);

  const playRecommendation = useCallback(async (i) => {
    const card = recCards[i];
    if (!card) return;
    try {
      const sr = await api('/api/netease/search', 'POST', { keywords: (card.title || '') + ' ' + (card.artist || ''), limit: 1 });
      const songs = sr?.result?.songs || [];
      if (songs.length > 0) {
        const s = songs[0];
        playDirectSong({
          title: s.name,
          artist: (s.artists || s.ar || []).map(a => a.name).join(' / '),
          netease_id: String(s.id),
          source: 'netease',
          cover: s.al?.picUrl || '',
          cover_url: s.al?.picUrl || '',
          tags: [],
          path: ''
        });
      }
    } catch (e) {}
  }, [recCards, playDirectSong]);

  const addRecommendation = useCallback(async (i) => {
    const card = recCards[i];
    if (!card) return;
    try {
      await api('/api/playlist/add', 'POST', {
        song: {
          source: 'netease',
          netease_id: card.netease_id || '',
          path: '',
          title: card.title || '',
          artist: card.artist || '',
          album: '',
          duration: 0,
          tags: [],
          cover: card.cover || ''
        }
      });
      await refreshPlaylist();
    } catch (e) {}
  }, [recCards, refreshPlaylist]);

  return (
    <div className="app-shell relative w-full h-screen overflow-hidden">
      <BackgroundEffects />
      <div className="dj-grid-overlay absolute inset-0 pointer-events-none z-[1]"></div>

      <TopNav state={state} onToggleMode={toggleMode}
        onTogglePlaylist={() => setPlaylistOpen(o => !o)} playlistOpen={playlistOpen}
        onSearch={() => setModal(m => ({ ...m, search: true }))} />

      {/* DJ View */}
      <div className="dj-broadcast-view">
        <BroadcastShell state={state}
          dispatch={dispatch}
          audioActions={uiAudioActions}
          viz={viz}
          isDjTalking={state.isDjTalking}
          onTransition={doTransition}
          onReact={handleReaction}
          scriptFeed={djScriptFeed}
          recCards={recCards}
          onSendChat={sendChat}
          onToggleVoiceMode={toggleVoiceMode}
          onPlayRec={playRecommendation}
          onAddRec={addRecommendation} />
      </div>
      {/* Playlist Slide */}
      <PlaylistSlide open={playlistOpen} songs={state.playlist.songs} currentIndex={state.playlist.current_index}
        onPlay={i => { uiAudioActions.loadSong(i); uiAudioActions.play(); }}
        onDelete={deleteSong} onClose={() => setPlaylistOpen(false)}
        onImport={() => setModal(m => ({ ...m, import: true }))}
        onSearch={() => setModal(m => ({ ...m, search: true }))}
        onImportPlaylist={() => setModal(m => ({ ...m, playlist: true }))}
        onLikes={() => setModal(m => ({ ...m, likes: true }))} />

      {/* Modals */}
      <ImportModal show={modal.import} onClose={() => setModal(m => ({ ...m, import: false }))} onRefresh={refreshPlaylist} />
      <NeteaseSearchModal show={modal.search} onClose={() => { setModal(m => ({ ...m, search: false })); setSearchInitKw(''); }} onPlayDirect={playDirectSong} onRefresh={refreshPlaylist} playlistSongs={state.playlist.songs} initKw={searchInitKw} />
      <PlaylistImportModal show={modal.playlist} onClose={() => setModal(m => ({ ...m, playlist: false }))} onRefresh={refreshPlaylist} playlistSongs={state.playlist.songs} />
      <LikesModal show={modal.likes} onClose={() => setModal(m => ({ ...m, likes: false }))} onRefresh={refreshPlaylist} playlistSongs={state.playlist.songs} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

<script>
(function() {
  function showBootError(msg) {
    if (document.getElementById('bootErrorOverlay')) return;
    const box = document.createElement('div');
    box.id = 'bootErrorOverlay';
    box.style.position = 'fixed';
    box.style.left = '16px';
    box.style.right = '16px';
    box.style.bottom = '16px';
    box.style.zIndex = '9999';
    box.style.padding = '12px 14px';
    box.style.borderRadius = '10px';
    box.style.border = '1px solid rgba(239,68,68,0.45)';
    box.style.background = 'rgba(25, 5, 8, 0.92)';
    box.style.color = '#fecaca';
    box.style.fontFamily = 'Consolas, Menlo, monospace';
    box.style.fontSize = '12px';
    box.style.lineHeight = '1.5';
    box.textContent = msg;
    document.body.appendChild(box);
  }

  window.addEventListener('error', function(e) {
    const text = e && e.message ? e.message : 'Unknown boot error';
    showBootError('UI 启动失败: ' + text);
  });

  window.addEventListener('unhandledrejection', function(e) {
    const reason = e && e.reason ? String(e.reason) : 'Unhandled Promise rejection';
    showBootError('UI 启动失败: ' + reason);
  });

  setTimeout(function() {
    const root = document.getElementById('root');
    if (!root) {
      showBootError('UI 启动失败: 缺少 #root 节点');
      return;
    }
    if (!root.children || root.children.length === 0) {
      showBootError('UI 未渲染。请按 Ctrl+F5 强制刷新，或重启后端再试。');
    }
  }, 2500);
})();
</script>

<!-- Particle Background (non-React for performance) -->
<script>
(function() {
  const canvas = document.getElementById('bgCanvas');
  const ctx = canvas.getContext('2d');
  let W, H, particles = [];
  let mouse = { x: -9999, y: -9999 };
  const COUNT = 500, RANGE = 110, FORCE = 5, SPRING = 0.018, DAMP = 0.84;

  function resize() {
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W; canvas.height = H;
    if (!particles.length) build();
  }

  function build() {
    particles = [];
    for (let i = 0; i < COUNT; i++) {
      const cx = W / 2, cy = H / 2, rx = W * 0.7, ry = H * 0.7;
      particles.push({
        x: Math.random() * W, y: Math.random() * H,
        tx: cx + (Math.random() - 0.5) * rx, ty: cy + (Math.random() - 0.5) * ry,
        vx: 0, vy: 0, size: 0.4 + Math.random() * 1.6,
        hue: Math.random() < 0.5 ? 190 + Math.random() * 40 : 250 + Math.random() * 30,
        lit: 35 + Math.random() * 45,
        alpha: 0.2 + Math.random() * 0.7,
        driftX: (Math.random() - 0.5) * 0.15, driftY: (Math.random() - 0.5) * 0.08,
      });
    }
  }

  function tick() {
    ctx.clearRect(0, 0, W, H);
    for (const p of particles) {
      const dx = mouse.x - p.x, dy = mouse.y - p.y, ds = dx * dx + dy * dy;
      if (ds < RANGE * RANGE && ds > 0.1) {
        const d = Math.sqrt(ds), f = (RANGE - d) / RANGE;
        p.vx -= (dx / d) * f * FORCE; p.vy -= (dy / d) * f * FORCE;
      }
      p.vx += (p.tx - p.x) * SPRING + p.driftX;
      p.vy += (p.ty - p.y) * SPRING + p.driftY;
      p.vx *= DAMP; p.vy *= DAMP;
      p.x += p.vx; p.y += p.vy;
      const a = p.alpha * (mouse.down ? 1.4 : 1);
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fillStyle = `hsla(${p.hue},70%,${p.lit}%,${a})`;
      ctx.fill();
    }
    requestAnimationFrame(tick);
  }

  window.addEventListener('resize', resize);
  document.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
  document.addEventListener('mousedown', () => { mouse.down = true; });
  document.addEventListener('mouseup', () => { mouse.down = false; });
  resize(); tick();
})();
</script>
